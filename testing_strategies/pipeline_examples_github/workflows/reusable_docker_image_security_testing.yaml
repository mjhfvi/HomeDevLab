    #   run: |
    #     VERSION=${{ steps.set_repository_data.outputs.LAST_TAG }}

    #     echo "Split Tag Version into major.minor.patch"
    #     IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

    #     echo "Validate Tag Number"
    #     if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] || ! [[ "$MINOR" =~ ^[0-9]+$ ]] || ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
    #       echo "Error: Invalid version format"
    #       exit 1
    #     fi

    #     echo "Increment Patch Version to Tag"
    #     NEW_PATCH=$((PATCH - 1))
    #     NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

    #     echo "New version: $NEW_VERSION"
    #     echo "MAIN_TAG=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@0.33.1
      with:
        image-ref: ghcr.io/octopusappdev/${{ steps.set_repository_data.outputs.REPOSITORY_NAME }}:latest
        format: 'table'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'

    - name: Docker Scout Testing for Vulnerabilities # GitHub Action source
      uses: docker/scout-action@f8c776824083494ab0d56b8105ba2ca85c86e4de
      with:
        command: cves,recommendations,sbom
        image: ghcr.io/octopusappdev/${{ steps.set_repository_data.outputs.REPOSITORY_NAME }}:latest
        sarif-file: sarif.output.json
        summary: true
        # github-token: ${{ secrets.GITHUB_TOKEN }}
