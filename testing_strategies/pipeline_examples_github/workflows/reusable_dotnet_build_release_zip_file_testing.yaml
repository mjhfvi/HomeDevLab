# Check README.md file in 'devops.azure.pipeline.templates' for more information
# Github actions variables https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/store-information-in-variables
name: Reusable DotNet Build SHA Files CI/CD Test

on:
  workflow_call:
    inputs:
      BUILDPLATFORM:
        description: "Build Platform"
        required: true
        type: string
        default: "x64"
      BUILDCONFIGURATION:
        description: "Build Configuration"
        required: true
        type: string
        default: "Release" # Options: Debug, Release Default: Release
      RESOURCE_GROUP:
        description: "Azure Resource Group"
        required: true
        type: string
        default: "octopus-development-israelcentral"
      SOLUTION_UI:
        description: "Solution File to Build"
        required: true
        type: string
        # default: "Octopus3.sln"
      VERSIONKEY_UI:
        description: "Version Key"
        required: true
        type: string
        # default: "numOfOctopusVersion"
      AZURE_WEBAPP_NAME:
        description: "Azure Web App Name"
        required: true
        type: string
        # default: "octopus-dev-il-webapp-ui"
      DONTNET_PROJECT_FILE_PATH:
        description: "Path to .NET Project File"
        required: true
        type: string
      SIGNED_FILES_WORKFLOW:
        description: "Whether to Sign Files in the Workflow"
        required: false
        default: true
        type: boolean
      ZIP_FILE_CREATE_PASSWORD:
        description: "Password to Create ZIP File"
        required: false
        default: ""
        type: string
    outputs:
      AZURE_WEBAPP_NAME:
        description: "Azure Web App Name"
        value: ${{ jobs.build-dotnet-solution-artifact.outputs.AZURE_WEBAPP_NAME }}
      VERSION_NUMBER:
        description: "Version Number from web.config"
        value: ${{ jobs.build-dotnet-solution-artifact.outputs.VERSION_NUMBER }}
      ARTIFACTS_URL:
        description: "URL to Download Artifacts"
        value: ${{ jobs.build-dotnet-solution-artifact.outputs.artifact-url }}
      ARTIFACTS_URL_SIGNED:
        description: "URL to Download Signed Artifacts"
        value: ${{ jobs.build-dotnet-solution-artifact.outputs.ARTIFACTS_URL_SIGNED }}
      ARTIFACTS_RETENTION_DAYS_SIGNED:
        description: "Retention Days for Signed Artifacts"
        value: ${{ jobs.build-dotnet-solution-artifact.outputs.ARTIFACTS_RETENTION_DAYS_SIGNED }}

jobs: # check runners status https://www.githubstatus.com/
  build-dotnet-solution-artifact:
    runs-on: windows-latest
    timeout-minutes: 30 # Set a timeout of 30 minutes for the job
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4.2.2
        with:
          repository: octopusappdev/integrations.agrint
          token: ${{ secrets.TOKEN_GITHUB_PACKAGES_REGISTRY_WRITE_ACCESS }}
          ref: ${{ github.ref }}
          fetch-depth: "0" # Fetch all history for all tags and branches
          fetch-tags: "0" # Fetch all tags
          lfs: "false" # Fetch all LFS objects
          # path: "ui"

      - name: Dotnet add Nuget Source
        run: dotnet nuget add source ${{ vars.NUGET_SOURCE_GITHUB }} --name OCTOPUS --username ${{ vars.TOKEN_GITHUB_PACKAGES_REGISTRY_USER }} --password ${{ secrets.TOKEN_GITHUB_PACKAGES_REGISTRY_WRITE_ACCESS }}

      - name: Dotnet Solution Restore
        run: dotnet restore ${{ inputs.DONTNET_PROJECT_FILE_PATH }} --verbosity ${{ github.ref == 'refs/heads/dev' && 'diagnostic' || 'normal' }} # Sets the verbosity level, values are quiet, minimal, normal, detailed, diagnostic, The default is minimal.

      - name: Dotnet Solution Build
        run: dotnet build ${{ inputs.DONTNET_PROJECT_FILE_PATH }} /nologo /nr:false /p:Configuration=${{ vars.BUILD_CONFIGURATION }} /p:Platform="Any CPU" /p:DeployOnBuild=true /p:DeployDefaultTarget=WebPublish /p:WebPublishMethod=FileSystem /p:publishUrl="WebAppContent" --output "artifacts"

      - name: Dotnet Publish Project to Artifacts Folder
        run: dotnet publish ${{ inputs.DONTNET_PROJECT_FILE_PATH }} --configuration Release --output ./artifacts

      - name: Add MSBuild to PATH (System Variable)
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: ${{ inputs.BUILDPLATFORM }}
          # vs-version: 'latest' # Use 'latest' OR '[17.0,16.5)' to get the version of Visual Studio

      # - name: Get Version Number
      #   id: get_version
      #   run: |
      #     $VERSION = Select-Xml -Path "web.config" -XPath "/configuration/appSettings/add" | Select-Object -ExpandProperty Node | Where-Object Key -match ${{ inputs.VERSIONKEY_UI }} | select -expand Value
      #     Write-Host "UI Version: $VERSION"
      #     echo "VERSION_NUMBER=$VERSION" >> $env:GITHUB_OUTPUT

      # - name: Remove Sections From WebConfig
      #   run: |
      #     $xml = [xml](Get-Content 'web.config')
      #     $node = $xml.SelectSingleNode("//appSettings")
      #     $node.ParentNode.RemoveChild($node) | Out-Null
      #     $node = $xml.SelectSingleNode("//connectionStrings")
      #     $node.ParentNode.RemoveChild($node) | Out-Null
      #     $xml.Save('web.config')

      - name: Upload Artifacts
        id: upload_artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: "dotnet-artifacts"
          path: "artifacts"
          retention-days: 14

    # outputs:
    #   AZURE_WEBAPP_NAME: ${{ inputs.AZURE_WEBAPP_NAME }}
    #   VERSION_NUMBER: ${{ steps.get_version.outputs.VERSION_NUMBER }}
    #   ARTIFACTS_URL: ${{ steps.upload_zip_ui.outputs.artifact-url }}

  sha256sum-action:
    runs-on: certificate
    needs: build-dotnet-solution-artifact
    timeout-minutes: 10 # Set a timeout for the job
    steps:
      #     - name: Add MSBuild to PATH (System Variable)
      #       uses: microsoft/setup-msbuild@v2
      #       with:
      #         msbuild-architecture: x64
      #         # vs-version: 'latest' # Use 'latest' OR '[17.0,16.5)' to get the version of Visual Studio you want.

      - name: Download Artifacts from Previous Job
        uses: actions/download-artifact@v5.0.0
        with:
          name: "dotnet-artifacts"
          path: "artifacts"

      - name: Build SHA256 for Artifacts
        id: hashing_files
        shell: pwsh
        run: |
          $OUTPUTFILE = "artifact-sha256sums.txt"
          Get-ChildItem -Path "artifacts" -Recurse -File | ForEach-Object {
              $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
              $relativePath = $_.FullName.Substring((Get-Item "artifacts").FullName.Length + 1)
              "$($hash.Hash)  $relativePath" >> $OUTPUTFILE
          }
          Write-Host "SHA256 hashes written to $OUTPUTFILE"

      - name: Upload SHA256 Artifact
        id: upload_sha256_artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: "artifacts-sha256-checksums"
          path: "artifact-sha256sums.txt"
          retention-days: 30

