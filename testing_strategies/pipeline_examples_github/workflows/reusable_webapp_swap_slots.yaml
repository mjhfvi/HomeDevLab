# Github actions variables https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/store-information-in-variables
name: Reusable WebApp Swap Slot

on:
  workflow_call:
    inputs:
      SWAP_SLOT_WORKFLOW:
        description: "Swap Slot Workflow"
        required: true
        type: string
      RESOURCE_GROUP:
        description: "Azure Resource Group Name"
        required: true
        type: string
      AZURE_WEBAPP_NAME:
        description: "Azure WebApp Name"
        required: true
        type: string
      WEBAPP_URL:
        description: "Azure WebApp URL"
        required: true
        type: string
      # HEALTH_CHECK_TEXT:
      #     description: "Health Check Text to Verify WebApp is Running"
      #     required: false
      #     type: string
      #     default: "Welcome"
    outputs:
      SWAP_SLOT_WORKFLOW:
        description: "Swap Slot Workflow"
        value: ${{ inputs.SWAP_SLOT_WORKFLOW }}
      RESOURCE_GROUP:
        description: "Azure Resource Group Name"
        value: ${{ inputs.RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME:
        description: "Azure WebApp Name"
        value: ${{ inputs.AZURE_WEBAPP_NAME }}
      WEBAPP_URL:
        description: "Azure WebApp URL"
        value: ${{ inputs.WEBAPP_URL }}
      # HEALTH_CHECK_TEXT:
      #     description: "Health Check Text to Verify WebApp is Running"
      #     value: ${{ inputs.HEALTH_CHECK_TEXT }}

jobs:
  # check runners status https://www.githubstatus.com/
  webapp-swap-slot:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
    # - name: Get Current WebApp Version
