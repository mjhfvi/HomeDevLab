    #       echo "Getting Current Webapp Version in URL: https://${{ inputs.WEBAPP_URL }}"
    #       # WEBAPP_VERSION=$(curl -s https://${{ inputs.WEBAPP_URL }}/Account/Login\?ReturnUrl\=%2f | grep -oE '[0-9]+\.[0-9]+\.[0-9]{8}+')
    #       WEBAPP_VERSION=$(curl -s https://${{ inputs.WEBAPP_URL }}/Account/Login\?ReturnUrl\=%2f )
    #       echo "- Current Webapp Version: $WEBAPP_VERSION"
    #       echo "- Current Webapp Version: $WEBAPP_VERSION" >> $GITHUB_STEP_SUMMARY

    - name: Azure Login
      run: az login --service-principal --username ${{ vars.AZURE_CLIENT_NAME_PROD }} --password ${{ secrets.AZURE_CLIENT_SECRET_PROD }} --tenant ${{ vars.AZURE_TENANT_ID }}

    - name: WebApp Swap ${{ inputs.SWAP_SLOT_WORKFLOW == 'staging -> beta' && 'From Slot staging Target Slot beta' || inputs.SWAP_SLOT_WORKFLOW == 'staging -> production' && 'From Slot staging Target Slot production' || inputs.SWAP_SLOT_WORKFLOW == 'beta -> production' && 'From Slot beta Target Slot production' }}
      run: |
        if [ "${{ inputs.SWAP_SLOT_WORKFLOW }}" = "staging -> beta" ]; then
          az webapp deployment slot swap --name ${{ inputs.AZURE_WEBAPP_NAME }} --resource-group ${{ inputs.RESOURCE_GROUP }} --slot staging --target-slot beta
        elif [ "${{ inputs.SWAP_SLOT_WORKFLOW }}" = "staging -> production" ]; then
          az webapp deployment slot swap --name ${{ inputs.AZURE_WEBAPP_NAME }} --resource-group ${{ inputs.RESOURCE_GROUP }} --slot staging --target-slot production
          az webapp deployment slot swap --name ${{ inputs.AZURE_WEBAPP_NAME }} --resource-group ${{ inputs.RESOURCE_GROUP }} --slot beta --target-slot latest
        elif [ "${{ inputs.SWAP_SLOT_WORKFLOW }}" = "rollback latest -> production" ]; then
          az webapp deployment slot swap --name ${{ inputs.AZURE_WEBAPP_NAME }} --resource-group ${{ inputs.RESOURCE_GROUP }} --slot latest --target-slot production
        fi

    outputs:
      WEBAPP_URL: ${{ inputs.WEBAPP_URL }}
      SWAP_SLOT_WORKFLOW: ${{ inputs.SWAP_SLOT_WORKFLOW }}
      AZURE_WEBAPP_NAME: ${{ inputs.AZURE_WEBAPP_NAME }}
