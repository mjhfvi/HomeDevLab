# Github actions variables https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/store-information-in-variables
name: Python PyPI Build and Push

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'dev'
  pull_request:
    branches:
      - 'main'
      - 'dev'

on:
  workflow_call:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  build-push-python-package:
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions configuration starts here
      id-token: write
      contents: read # 'read' access to repository contents
      pull-requests: write # 'write' access to pull requests
    timeout-minutes: 30 # Set a timeout for the job
    environment:
      name: pypi
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: "0" # Fetch all history for all tags and branches
          fetch-tags: "0" # Fetch all tags
          lfs: "false" # Fetch all LFS objects

      # - name: Bump version
      #   run: |
      #     git config --global user.name "github-actions[bot]"
      #     git config --global user.email "github-actions[bot]@users.noreply.github.com"
      #     npm version patch -m "chore: bump version to %s [skip ci]"
      #     git push --follow-tags

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          packages-dir: dist/
