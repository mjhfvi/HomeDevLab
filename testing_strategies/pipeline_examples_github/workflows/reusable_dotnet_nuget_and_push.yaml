name: Reusable Dotnet Nuget Package Build and Push to GitHub Packages Registry

on:
  workflow_call:
    inputs:
      DONTNET_PROJECT_FILE_PATH:
        description: "Path to Solution File"
        required: true
        type: string
      VERSION_KEY:
        description: "Version Key to Extract From web.config"
        required: true
        type: string
      BUILD_CONFIGURATION:
        description: "Build Configuration (e.g. Debug, Release)"
        required: false
        # default: "Release"
        type: string
      SIGNED_FILES_WORKFLOW:
        description: "Whether to Sign Files in the Workflow"
        required: false
        default: false
        type: boolean
    outputs:
      MSBUILD_VERSION:
        description: "MSBuild Version"
        value: ${{ jobs.build-nuget-package.outputs.MSBUILD_VERSION }}
      ASSEMBLY_NAME:
        description: "Assembly Name"
        value: ${{ jobs.build-nuget-package.outputs.ASSEMBLY_NAME }}
      ASSEMBLY_VERSION:
        description: "Assembly Version"
        value: ${{ jobs.build-nuget-package.outputs.ASSEMBLY_VERSION }}
      SIGNED_FILES_COUNT:
        description: "Count of Signed Files"
        value: ${{ jobs.sign-code-files.outputs.SIGNED_FILES_COUNT }}
      ARTIFACTS_URL:
        description: "URL to Download Artifacts"
        value: ${{ jobs.build-nuget-package.outputs.ARTIFACTS_URL }}
      ARTIFACTS_RETENTION_DAYS:
        description: "Number of Days to Retain Artifacts"
        value: ${{ jobs.build-nuget-package.outputs.ARTIFACTS_RETENTION_DAYS }}
      ARTIFACTS_SIGNED_FILES_COUNT:
        description: "Count of Signed Files in Artifacts"
        value: ${{ jobs.sign-code-files.outputs.SIGNED_FILES_COUNT }}
      ARTIFACTS_URL_SIGNED:
        description: "URL to Download Signed Artifacts"
        value: ${{ jobs.sign-code-files.outputs.ARTIFACTS_URL_SIGNED }}
      ARTIFACTS_RETENTION_DAYS_SIGNED:
        description: "Number of Days to Retain Signed Artifacts"
        value: ${{ jobs.sign-code-files.outputs.ARTIFACTS_RETENTION_DAYS_SIGNED }}
      SIGNED_FILES_WORKFLOW:
        description: "Whether Files were Signed in the Workflow"
        value: ${{ jobs.sign-code-files.outputs.SIGNED_FILES_WORKFLOW }}

jobs:
  build-nuget-package:
    runs-on: windows-latest
    timeout-minutes: 10 # Set a timeout for the job
    steps:
    - name: Checkout Git Repository
      uses: actions/checkout@v4.2.2
      with:
        fetch-depth: "0" # Fetch all history for all tags and branches
        fetch-tags: "0" # Fetch all tags
        lfs: "false" # Fetch all LFS objects

    - name: Extract Assembly Information from CSProj File
      id: get_assembly_info
      shell: pwsh
      run: |
        $VERSION = Select-String -Path ${{ inputs.DONTNET_PROJECT_FILE_PATH }} -Pattern '<AssemblyVersion>(.*?)</AssemblyVersion>' | % { $_.Matches.Groups[1].Value }
        $NAME = Select-String -Path ${{ inputs.DONTNET_PROJECT_FILE_PATH }} -Pattern '<AssemblyName>(.*?)</AssemblyName>' | % { $_.Matches.Groups[1].Value }
        echo "ASSEMBLY_VERSION=$VERSION"  >> $env:GITHUB_OUTPUT
        echo "ASSEMBLY_NAME=$NAME"        >> $env:GITHUB_OUTPUT

    - name: Add MSBuild to PATH (System Variable)
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
        # vs-version: 'latest' # Use 'latest' OR '[17.0,16.5)' to get the version of Visual Studio you want.

    - name: Dotnet add Nuget Source
      run: dotnet nuget add source ${{ vars.NUGET_SOURCE_GITHUB }} --name OCTOPUS --username ${{ vars.TOKEN_GITHUB_PACKAGES_REGISTRY_USER }} --password ${{ secrets.TOKEN_GITHUB_PACKAGES_REGISTRY_WRITE_ACCESS }}

    - name: Dotnet List All Nuget Source
      run: dotnet nuget list source

    - name: Dotnet NuGet Restore
      run: dotnet restore ${{ inputs.DONTNET_PROJECT_FILE_PATH }} --verbosity ${{ github.ref == 'refs/heads/dev' && 'detailed' || 'normal' }} # Sets the verbosity level, values are quiet, minimal, normal, detailed, diagnostic, The default is minimal.

    - name: Dotnet Solution Build
      run: dotnet build ${{ inputs.DONTNET_PROJECT_FILE_PATH }} --no-restore --configuration ${{ vars.BUILD_CONFIGURATION || github.ref == 'refs/heads/dev' && 'Debug' || 'Release' }} --output "artifacts"

    - name: Get MSBuild Version
      id: get_msbuild_version
      shell: pwsh
      run: |
        $MSBUILD_VERSION = & msbuild -version
        echo "MSBUILD_VERSION=$MSBUILD_VERSION" >> $env:GITHUB_OUTPUT

    - name: Upload Artifacts
      id: upload_artifacts
      uses: actions/upload-artifact@v4.6.2
      with:
        name: "build-artifacts"
        path: "artifacts"
        retention-days: 14

    outputs:
      MSBUILD_VERSION: ${{ steps.get_msbuild_version.outputs.MSBUILD_VERSION }}
      ASSEMBLY_NAME: ${{ steps.get_assembly_info.outputs.ASSEMBLY_NAME || 'OCTOPUS.Microservices' }} # Default to OCTOPUS.Microservices if not found
      ASSEMBLY_VERSION: ${{ steps.get_assembly_info.outputs.ASSEMBLY_VERSION }}
      ARTIFACTS_URL: ${{ steps.upload_artifacts.outputs.artifact-url }}
      ARTIFACTS_RETENTION_DAYS: "14"

  sign-code-files:
    runs-on: certificate
    needs: build-nuget-package
    timeout-minutes: 10 # Set a timeout for the job
    steps:
    - name: Add MSBuild to PATH (System Variable)
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
        # vs-version: 'latest' # Use 'latest' OR '[17.0,16.5)' to get the version of Visual Studio you want.

    - name: Download Artifacts from Previous Job
      uses: actions/download-artifact@v5.0.0
      with:
        name: "build-artifacts"
        path: "artifacts"

    - name: Signing dll and exe Files with Certificate
      if: ${{ inputs.SIGNED_FILES_WORKFLOW == true }}
      id: find_files_to_sign
      shell: pwsh
      run: |
        $SearchPath = "artifacts"
        $fileCount = 0

        Write-Host "Searching for dll and exe Files to Sign ..."
        Write-Host "Search path: $SearchPath"
        Write-Host ""

        # Search for .dll and .exe files containing 'octopus' in the filename (including all subfolders)
        $files = Get-ChildItem -Path $SearchPath -Include *.dll,*.exe -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*octopus*" }

        foreach ($file in $files) {
            $fileCount++
            Write-Host "Processing [$fileCount]: $($file.FullName)"

            try {
                Write-Host "Signing Certificate Information to File"
                scsigntool /pin ${{ secrets.SCSIGNTOOL_PIN_CODE }} sign /a /sm /sha1 ${{ secrets.SCSIGNTOOL_CERTIFICATE_SHA }} /fd SHA256 /t "http://timestamp.digicert.com" /d ${{ needs.build-nuget-package-push.outputs.ASSEMBLY_NAME || 'OCTOPUS.Microservices' }} /du "https://www.octopus-app.com" $($file.FullName)

                Write-Host "Checking That File Missing Certificate Information"
                signtool verify /pa $($file.FullName)
            }
            catch {
                Write-Host "  Error: $($_.Exception.Message)"
            }
            Write-Host ""
        }
        Write-Host "Search completed, Total files found: $fileCount"
        echo "SIGNED_FILES_COUNT=$fileCount" >> $env:GITHUB_OUTPUT

    - name: Upload Artifacts
      id: upload_artifacts_signed
      uses: actions/upload-artifact@v4.6.2
      with:
        name: "signed-build-artifacts"
        path: "artifacts"
        retention-days: 14

    outputs:
      SIGNED_FILES_COUNT: ${{ steps.find_files_to_sign.outputs.SIGNED_FILES_COUNT || '0' }} # Default to 0 if no files were signed
      ARTIFACTS_URL_SIGNED: ${{ steps.upload_artifacts_signed.outputs.artifact-url }}
      ARTIFACTS_RETENTION_DAYS_SIGNED: "14"
      SIGNED_FILES_WORKFLOW: ${{ steps.find_files_to_sign.outputs.SIGNED_FILES_COUNT > 0 }}

  nuget-package-push:
    runs-on: windows-latest
    needs: sign-code-files
    timeout-minutes: 10 # Set a timeout for the job
    steps:
    - name: Checkout Git Repository
      uses: actions/checkout@v4.2.2
      with:
        fetch-depth: "0" # Fetch all history for all tags and branches
        fetch-tags: "0" # Fetch all tags
        lfs: "false" # Fetch all LFS objects

    - name: Download Artifacts from Previous Job
      uses: actions/download-artifact@v5.0.0
      with:
        name: "signed-build-artifacts"
        path: "artifacts"

    - name: Add MSBuild to PATH (System Variable)
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
        # vs-version: 'latest' # Use 'latest' OR '[17.0,16.5)' to get the version of Visual Studio you want.

    - name: Dotnet add Nuget Source
      run: dotnet nuget add source ${{ vars.NUGET_SOURCE_GITHUB }} --name OCTOPUS --username ${{ vars.TOKEN_GITHUB_PACKAGES_REGISTRY_USER }} --password ${{ secrets.TOKEN_GITHUB_PACKAGES_REGISTRY_WRITE_ACCESS }}

    - name: Dotnet Package Dependencies
      shell: pwsh
      run: |
        Write-Host "Running Dotnet Pack ..."
        if ("${{ github.ref }}" -eq "refs/heads/main") {
          Write-Host "Running on 'main' Branch, Creating Package with Production version."
          dotnet pack ${{ inputs.DONTNET_PROJECT_FILE_PATH }} --configuration ${{ github.ref == 'refs/heads/dev' && 'debug' || 'Release' }} --artifacts-path ./artifacts --output ./artifacts-signed
        } elseif ("${{ github.ref }}" -eq "refs/heads/dev") {
          Write-Host "Running on 'dev' Branch, Creating Package with suffix 'dev' version."
          dotnet pack ${{ inputs.DONTNET_PROJECT_FILE_PATH }} --configuration ${{ github.ref == 'refs/heads/dev' && 'debug' || 'Release' }} --artifacts-path ./artifacts --output ./artifacts-signed --version-suffix dev
        } else {
          Write-Host "Running on 'bugfix' Branch, Creating Package with suffix 'bugfix' version."
          dotnet pack ${{ inputs.DONTNET_PROJECT_FILE_PATH }} --configuration ${{ github.ref == 'refs/heads/dev' && 'debug' || 'Release' }} --artifacts-path ./artifacts --output ./artifacts-signed --version-suffix bugfix
        }

    - name: Dotnet NuGet Package Project
      run: dotnet pack ${{ inputs.DONTNET_PROJECT_FILE_PATH }} --configuration Release --output ./artifacts
    #   run: Get-ChildItem -Recurse -Filter *.csproj | ForEach-Object { dotnet pack $_.FullName --configuration Release --output ./artifacts }

    - name: Publish Dotnet NuGet Package
      run: |
        dir .
        cd artifacts;
        dir .
        dotnet nuget push *.nupkg --source ${{ vars.NUGET_SOURCE_GITHUB }} --api-key ${{ secrets.TOKEN_GITHUB_PACKAGES_REGISTRY_WRITE_ACCESS }} --skip-duplicate
