name: Reusable Dotnet Build Solution and Upload Artifacts

on:
  workflow_call:
    inputs:
      # DONTNET_PROJECT_FILE_PATH:
      #     description: "Path to Solution File"
      #     required: true
      #     type: string
      BUILD_PLATFPORM:
        description: "Build Platform (e.g. x64)"
        required: false
        default: "x64"
        type: string
      BUILD_CONFIGURATION:
        description: "Build Configuration (e.g. Debug, Release)"
        required: false
        default: "Release"
        type: string
      SOLUTION_FILE_PATH_API:
        description: "Path to Solution File"
        required: true
        type: string
      SOLUTION_FILE_PATH_UI:
        description: "Path to Solution File"
        required: true
        type: string
      VERSION_KEY_API:
        description: "Version Key to Extract From CSPROJ file"
        required: true
        type: string
      VERSION_KEY_UI:
        description: "Version Key to Extract From CSPROJ file"
        required: true
        type: string
      AZURE_WEBAPP_NAME_API:
        description: "Azure WebApp URL"
        required: true
        type: string
      AZURE_WEBAPP_NAME_UI:
        description: "Azure WebApp URL"
        required: true
        type: string
      RESOURCE_GROUP:
        description: "Azure Resource Group Name"
        required: true
        type: string
        default: "octopus-production-northcentralus"
      REMOVE_NLOG_FILES:
        description: "Remove NLog Files After Build"
        required: false
        type: string
        default: "true"
      SIGNED_FILES_WORKFLOW:
        description: "Signed Files Workflow"
        required: false
        type: string
        default: "false"
      # HEALTH_CHECK_TEXT:
      #     description: "Health Check Text to Verify WebApp is Running"
      #     required: true
      #     type: string
      # HEALTH_CHECK_URL:
      #     description: "Health Check URL Path"
      #     required: false
      #     type: string
    outputs:
      MSBUILD_VERSION:
        description: "MSBuild Version"
        value: ${{ jobs.build-solution.outputs.MSBUILD_VERSION }}
      ASSEMBLY_NAME:
        description: "Assembly Name"
        value: ${{ jobs.build-solution.outputs.ASSEMBLY_NAME }}
      ASSEMBLY_VERSION:
        description: "Assembly Version"
        value: ${{ jobs.build-solution.outputs.ASSEMBLY_VERSION }}

jobs:
  build-solution:
    runs-on: windows-latest
    strategy:
      matrix:
        PROJECT: [ui, api] # Define the items to iterate over
        include:
          - PROJECT: ui
            REPOSITORY_NAME: octopus.ui
            PROJECT_PATH: ui
            SOLUTION_FILE_PATH: ${{ inputs.SOLUTION_FILE_PATH_UI }}
            VERSION_KEY: ${{ inputs.VERSION_KEY_UI }}
            AZURE_WEBAPP_NAME: ${{ inputs.AZURE_WEBAPP_NAME_UI }}
            RESOURCE_GROUP: ${{ inputs.RESOURCE_GROUP }}
            REMOVE_NLOG_FILES: ${{ inputs.REMOVE_NLOG_FILES }}
            # SIGNED_FILES_WORKFLOW: ${{ inputs.SIGNED_FILES_WORKFLOW }}
          - PROJECT: api
            REPOSITORY_NAME: octopus.api
            PROJECT_PATH: api
            SOLUTION_FILE_PATH: ${{ inputs.SOLUTION_FILE_PATH_API }}
            VERSION_KEY: ${{ inputs.VERSION_KEY_API }}
            AZURE_WEBAPP_NAME: ${{ inputs.AZURE_WEBAPP_NAME_API }}
            RESOURCE_GROUP: ${{ inputs.RESOURCE_GROUP }}
            REMOVE_NLOG_FILES: ${{ inputs.REMOVE_NLOG_FILES }}
            # SIGNED_FILES_WORKFLOW: ${{ inputs.SIGNED_FILES_WORKFLOW }}
    timeout-minutes: 10 # Set a timeout for the job
    steps:
      - name: Checkout Git Repository - ${{ matrix.REPOSITORY_NAME }}
        uses: actions/checkout@v4.2.2
        with:
          repository: octopusappdev/${{ matrix.REPOSITORY_NAME }}
          ref: dev
          path: ${{ matrix.PROJECT_PATH }}
          token: ${{ secrets.TOKEN_GITHUB_PACKAGES_REGISTRY_WRITE_ACCESS }}
          fetch-depth: "0" # Fetch all history for all tags and branches
          fetch-tags: "0" # Fetch all tags
          lfs: "false" # Fetch all LFS objects

      - name: Add MSBuild to PATH (System Variable)
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
          # vs-version: 'latest' # Use 'latest' OR '[17.0,16.5)' to get the version of Visual Studio you want.

      - name: Dotnet add Nuget Source
        run: dotnet nuget add source ${{ vars.AZURE_NUGET_SOURCE }} --name OCTOPUS --username ${{ vars.TOKEN_GITHUB_PACKAGES_REGISTRY_USER }} --password ${{ secrets.TOKEN_GITHUB_PACKAGES_REGISTRY_WRITE_ACCESS }}

      - name: Dotnet Solution Restore
        run: dotnet restore ${{ matrix.PROJECT_PATH }}\${{ matrix.SOLUTION_FILE_PATH }} --verbosity Normal

      - name: Dotnet Solution Build
        run: dotnet build ${{ matrix.PROJECT_PATH }}\${{ matrix.SOLUTION_FILE_PATH }} /nologo /nr:false /p:Configuration=${{ matrix.BUILD_CONFIGURATION }} /p:Platform="Any CPU" /p:DeployOnBuild=true /p:DeployDefaultTarget=WebPublish /p:WebPublishMethod=FileSystem /p:publishUrl="WebAppContent" --output "artifacts"

      - name: Remove Nlog Files After Build
        if: ${{ matrix.REMOVE_NLOG_FILES == 'true' }}
        shell: pwsh
        run: |
          $nlogFiles = Get-ChildItem -Path "artifacts" -Recurse -Include "NLog.config", "NLog.dll", "NLog.Extensions.Logging.dll", "NLog.Web.AspNetCore.dll" -ErrorAction SilentlyContinue
          foreach ($file in $nlogFiles) {
              Write-Host "Removing NLog File: $($file.FullName)"
              Remove-Item -Path $file.FullName -Force
          }

      - name: Remove Sections From WebConfig
        run: |
          $xml = [xml](Get-Content '${{ matrix.PROJECT_PATH }}\web.config')
          $node = $xml.SelectSingleNode("//appSettings")
          $node.ParentNode.RemoveChild($node) | Out-Null
          $node = $xml.SelectSingleNode("//connectionStrings")
          $node.ParentNode.RemoveChild($node) | Out-Null
          $xml.Save('${{ matrix.PROJECT_PATH }}\web.config')

      - name: Get Project Version Number
        id: get_version
        run: |
          $XML = [xml](Get-Content ${{ matrix.PROJECT_PATH }}\${{ matrix.DONTNET_PROJECT_FILE_PATH }})
          $VERSION = $XML.Project.PropertyGroup.Version
          Write-Host "Application Version Number: $VERSION"
          echo "VERSION_NUMBER=$VERSION" >> $env:GITHUB_OUTPUT

      - name: Get MSBuild Version
        id: get_msbuild_version
        shell: pwsh
        run: |
          $MSBUILD_VERSION = & msbuild -version
          echo "MSBUILD_VERSION=$MSBUILD_VERSION" >> $env:GITHUB_OUTPUT

      # - name: Upload ZIP to Artifact Store
      #   uses: actions/upload-artifact@v4.6.2
      #   with:
      #       name: ${{ github.run_id }}-ui
      #       path: |
      #           ${{ env.PROJECT_PATH }}\App_Code
      #           ${{ env.PROJECT_PATH }}\App_Data
      #           ${{ env.PROJECT_PATH }}\bin
      #           ${{ env.PROJECT_PATH }}\Content
      #           ${{ env.PROJECT_PATH }}\Images
      #           ${{ env.PROJECT_PATH }}\librdkafka
      #           ${{ env.PROJECT_PATH }}\ReportsBi
      #           ${{ env.PROJECT_PATH }}\Scripts
      #           ${{ env.PROJECT_PATH }}\Styles
      #           ${{ env.PROJECT_PATH }}\Views
      #           ${{ env.PROJECT_PATH }}\apple-touch-icon-114x114.png
      #           ${{ env.PROJECT_PATH }}\apple-touch-icon-120x120.png
      #           ${{ env.PROJECT_PATH }}\apple-touch-icon-144x144.png
      #           ${{ env.PROJECT_PATH }}\apple-touch-icon-152x152.png
      #           ${{ env.PROJECT_PATH }}\apple-touch-icon-180x180.png
      #           ${{ env.PROJECT_PATH }}\apple-touch-icon-57x57.png
      #           ${{ env.PROJECT_PATH }}\apple-touch-icon-60x60.png
      #           ${{ env.PROJECT_PATH }}\apple-touch-icon-72x72.png
      #           ${{ env.PROJECT_PATH }}\apple-touch-icon-76x76.png
      #           ${{ env.PROJECT_PATH }}\ApplicationInsights.config
      #           ${{ env.PROJECT_PATH }}\favicon.ico
      #           ${{ env.PROJECT_PATH }}\Global.asax
      #           ${{ env.PROJECT_PATH }}\grpc_csharp_ext.x64.dll
      #           ${{ env.PROJECT_PATH }}\grpc_csharp_ext.x86.dll
      #           ${{ env.PROJECT_PATH }}\libgrpc_csharp_ext.x64.dylib
      #           ${{ env.PROJECT_PATH }}\libgrpc_csharp_ext.x64.so
      #           ${{ env.PROJECT_PATH }}\robots.txt
      #           ${{ env.PROJECT_PATH }}\Web.config
      #       include-hidden-files: "false"
      #       retention-days: "60"
      #       overwrite: "false"
      #       if-no-files-found: "error"

      - name: Adding Information to Pipeline Summary
        run: |
          echo "## Pipeline Build Information"                                                                              >> $env:GITHUB_STEP_SUMMARY
          echo "- ${{ matrix.PROJECT_PATH }} Project Version Tag: ${{ steps.get_version.outputs.VERSION_NUMBER }}"             >> $env:GITHUB_STEP_SUMMARY
          echo "- ${{ matrix.PROJECT_PATH }} Project Build Artifact ID: ${{ steps.upload_artifacts.outputs.artifact-id }}"     >> $env:GITHUB_STEP_SUMMARY
          echo "- ${{ matrix.PROJECT_PATH }} Project Build Download URL: ${{ steps.upload_artifacts.outputs.artifact-url }}"   >> $env:GITHUB_STEP_SUMMARY
          # echo "- Dotnet Packages Security Reports: ${{ steps.upload_package_reports.outputs.artifact-url }}"             >> $env:GITHUB_STEP_SUMMARY

    outputs:
      MSBUILD_VERSION: ${{ steps.get_msbuild_version.outputs.MSBUILD_VERSION }}
      ASSEMBLY_NAME: ${{ steps.get_version.outputs.ASSEMBLY_NAME || 'OCTOPUS.Microservices' }} # Default to OCTOPUS.Microservices if not found
      ASSEMBLY_VERSION: ${{ steps.get_version.outputs.VERSION_NUMBER }}
      ARTIFACTS_URL: ${{ steps.upload_artifacts.outputs.artifact-url }}
      ARTIFACTS_RETENTION_DAYS: "14"

