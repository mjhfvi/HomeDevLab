---
- name: Create a 'octopus' namespace
  when: kubernetes_master | default(false) | bool
  become: true
  kubernetes.core.k8s:
    name: octopus
    api_version: v1
    kind: Namespace
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
  tags: [argocd_setup, argocd_docker_registry]
- name: Create Kubernetes Secret 'docker-registry-secret' for Octopus Docker Registry
  become: true
  when: kubernetes_master | default(false) | bool
  command: "kubectl create secret -n octopus docker-registry docker-registry-secret --docker-server={{ docker_registry_secret_repository }} --docker-username={{ docker_registry_secret_username }} --docker-password={{ docker_registry_secret_password }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf # Ensure kubectl uses the correct config on the master
  tags: [argocd_setup, argocd_docker_registry]
