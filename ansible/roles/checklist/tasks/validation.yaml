---
# OS Detection and Validation Task
# Add this to your main.yaml before including other playbooks
- name: Gather System Facts For Nodes
  setup:
    gather_subset:
      - '!all'
      - '!any'
      - distribution
      - distribution_version
      - distribution_major_version
      - os_family
  tags: [checklist_setup, os_gether_facts]
- name: Display detected OS information
  debug:
    msg:
      - 'Operating System: {{ ansible_distribution }}'
      - 'OS Version: {{ ansible_distribution_version }}'
      - 'OS Major Version: {{ ansible_distribution_major_version }}'
      - 'OS Family: {{ ansible_os_family }}'
      - 'Architecture: {{ ansible_architecture }}'
  tags: [checklist_setup, os_gether_facts]
- name: Set OS-specific variables
  set_fact:
    os_type: '{{ ansible_distribution | lower }}'
    os_version: '{{ ansible_distribution_version }}'
    os_major_version: '{{ ansible_distribution_major_version }}'
    os_family: '{{ ansible_os_family | lower }}'
  tags: [checklist_setup, os_gether_facts]
- name: Validate supported operating systems
  assert:
    that: [ansible_os_family in supported_os_families]
    fail_msg: "Unsupported OS family: {{ ansible_os_family }}. Supported: {{ supported_os_families | join(', ') }}"
    success_msg: 'OS validation passed: {{ ansible_distribution }} {{ ansible_distribution_version }}'
  vars:
    supported_os_families: [RedHat, Debian, Suse, Archlinux, Windows]
  tags: [checklist_setup, os_gether_facts]
- name: Check minimum OS version requirements
  assert:
    that:
      - (ansible_distribution == "Ubuntu" and ansible_distribution_version is version('18.04',
        '>=')) or (ansible_distribution == "CentOS" and ansible_distribution_major_version
        | int >= 7) or (ansible_distribution == "RHEL" and ansible_distribution_major_version
        | int >= 7) or (ansible_distribution == "Debian" and ansible_distribution_major_version
        | int >= 9) or (ansible_distribution not in ["Ubuntu", "CentOS", "RHEL",
        "Debian"])
    fail_msg: OS version {{ ansible_distribution }} {{ ansible_distribution_version }}
      does not meet minimum requirements
    success_msg: OS version check passed
  tags: [checklist_setup, os_gether_facts]
  when: validate_os_version | default(true) | bool
- name: Create OS-specific include path
  set_fact:
    os_specific_playbook: playbooks/{{ os_type }}/{{ os_major_version }}/main.yml
    os_family_playbook: playbooks/{{ os_family }}/main.yml
    generic_playbook: playbooks/common/main.yml
  tags: [checklist_setup, os_gether_facts]
- name: Check for OS-specific playbook
  stat:
    path: '{{ os_specific_playbook }}'
  register: os_specific_exists
  delegate_to: localhost
  tags: [checklist_setup, os_gether_facts]
