- name: Initialize the Kubernetes Cluster using 'kubeadm'
  become: true
  when: kubernetes_master | default(false) | bool
  command: kubeadm init --service-cidr=10.96.0.0/12 --pod-network-cidr=10.244.0.0/16
  # --control-plane-endpoint=51.4.105.117:6443 --apiserver-advertise-address={{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}
  register: kubeadm_init_command_result
  tags: [kubeadm_setup, kubeadm_init]

# - name: Ensure required variable is defined
