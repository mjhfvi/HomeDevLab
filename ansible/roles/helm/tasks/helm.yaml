---
- name: Add Helm apt-key
  become: true
  get_url:
    url: https://baltocdn.com/helm/signing.asc
    dest: /usr/share/keyrings/helm-apt-keyring.asc
    mode: "0644"
    force: true
  tags: [helm_setup, helm_install]
- name: Adding APT Repository for Helm
  become: true
  apt_repository:
    repo:
      deb [signed-by=/usr/share/keyrings/helm-apt-keyring.asc] https://baltocdn.com/helm/stable/debian/
      all main
    state: present
    update_cache: true
    filename: kubernetes
  tags: [helm_setup, helm_install]
- name: Install Helm Package using APT
  become: true
  apt:
    name: [helm]
    state: present
    update_cache: true
  tags: [helm_setup, helm_install]
- name: Display Helm Version
  command:
    cmd: helm version --short
  register: helm_version
  tags: [helm_setup, helm_install]
- name: Show Helm Version
  debug:
    msg: "{{ helm_version.stdout }}"
  tags: [helm_setup, helm_install]
