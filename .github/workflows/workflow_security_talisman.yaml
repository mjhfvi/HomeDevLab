---
name: Workflow Security Talisman
on:  # yamllint disable-line rule:truthy
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - 'config/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:  # Allows this workflow to be called and reused by other workflows
permissions: {}
jobs:
  build:
    name: talisman-scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect secrets with Talisman in incoming commits (DEPRECATED)
        uses: carhartl/talisman-secrets-scan-action@702fc5c52170632a568124896148a80f38521ac4
