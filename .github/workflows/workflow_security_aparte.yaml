---
name: Workflow Security Aparte Scanner
on:  # yamllint disable-line rule:truthy
  # push:  # Triggers on any push event
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:
  workflow_call:  # Allows this workflow to be called and reused by other workflows
permissions: {}
jobs:
  build:
    name: security-code-aparte-scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Aparte Secrets Action
        uses: apartejs/aparte-secrets-action@f1535c7323f766c4ca8beb2bc1cf1d6157213345
