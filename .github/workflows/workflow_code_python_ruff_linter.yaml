---
name: Workflow Code Python Ruff Linter
on:  # yamllint disable-line rule:truthy
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - '**/manifests/**'
  #     - '**/template/**'
  # pull_request:
  #   branches: [main]
  #   paths-ignore:
  #     - '**/manifests/**'
  #     - '**/template/**'
  workflow_dispatch:
  workflow_call:  # Allows this workflow to be called and reused by other workflows
permissions: {}
jobs:
  build:
    name: code-python-ruff-linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout code
        uses: jpetrucciani/ruff-check@8d2b39daadb846de475981360980a99f39f1f534
        with:
          path: .
