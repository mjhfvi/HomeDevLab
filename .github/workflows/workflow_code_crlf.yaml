---
name: Workflow Code CRLF Line Endings
on:  # yamllint disable-line rule:truthy
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - '**/manifests/**'
  #     - '**/template/**'
  # pull_request:
  #   branches: [main]
  #   paths-ignore:
  #     - '**/manifests/**'
  #     - '**/template/**'
  workflow_dispatch:
  workflow_call:  # Allows this workflow to be called and reused by other workflows
permissions: {}
jobs:
  build:
    name: check-crlf
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for CRLF line endings
        uses: gi-org-pl/check-crlf-action@464995c09f1659cd4b0f7e2bf7234994f0fd705e
        continue-on-error: true
        with:
          base-ref: ${{ github.base_ref }}
