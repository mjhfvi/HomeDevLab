---
name: Workflow Code Run pip Package
on:  # yamllint disable-line rule:truthy
  # push:  # Triggers on any push event
  #   branches: [main]
  #   paths:
  #     - '**/*.py'
  #   paths-ignore:
  #     - 'config/**'
  # pull_request:
  #   branches: [main]
  workflow_dispatch:
  workflow_call:  # Allows this workflow to be called and reused by other workflows
permissions: {}
env:
  PYTHON_VERSION: '3.13'
jobs:
  build:
    name: code-python-run-pip-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
      - name: Install pip Packages
        run: pip install ruff
      - name: Cache pip Packages
        id: cache-primes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: prime-numbers
          key: ${{ runner.os }}-pip
        timeout-minutes: 5
      - name: Run unimport check
        uses: ./
        with:
          extra_args: --include src/
        timeout-minutes: 5
