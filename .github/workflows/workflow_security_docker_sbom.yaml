---
name: Workflow Security Docker Scout SBOM Scanner
on:  # yamllint disable-line rule:truthy
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - 'config/**'
  # pull_request:
  #   branches: [main]
  workflow_dispatch:
  workflow_call:  # Allows this workflow to be called and reused by other workflows
permissions: {}
jobs:
  build:
    name: security-code-docker-scout-scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect secrets with Talisman in incoming commits (DEPRECATED)
        uses: carhartl/talisman-secrets-scan-action@702fc5c52170632a568124896148a80f38521ac4
      - name: Docker Scout SBOM Scanner
        id: docker-scout
        # if: ${{ github.event_name == 'pull_request' }}
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa
        with:
          command: compare
          image: ${{ steps.meta.outputs.tags }}
          to: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMPARE_TAG }}
          ignore-unchanged: true
          only-severities: critical,high
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}  # to be able to write the comment
