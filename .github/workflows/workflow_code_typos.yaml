---
name: Workflow Code Typos
on:  # yamllint disable-line rule:truthy
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - '**/manifests/**'
  #     - '**/template/**'
  # pull_request:
  #   branches: [main]
  #   paths-ignore:
  #     - '**/manifests/**'
  #     - '**/template/**'
  workflow_dispatch:
  workflow_call:  # Allows this workflow to be called and reused by other workflows
permissions: {}
jobs:
  build:
    name: code-typos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Typos Action
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
