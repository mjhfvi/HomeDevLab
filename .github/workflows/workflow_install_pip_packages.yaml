---
name: Workflow Install pip Packages
on:  # yamllint disable-line rule:truthy
  # push:  # Triggers on any push event
  #   branches: [main]
  #   paths:
  #     - '**/*.py'
  #   paths-ignore:
  #     - 'config/**'
  #     - 'config/local.json'
  #     - '/*.draft.md' # Ignores files matching extension globally
  # pull_request:
  #   branches: [main]
  workflow_dispatch:  # Adds a "Run workflow" button in the GitHub Actions UI
  workflow_call:  # Allows this workflow to be called and reused by other workflows
  # schedule:
  #  # Runs at 00:00 every day
  #   - cron: '0 0 * * *'
permissions: {}
env:
  PYTHON_VERSION: '3.13'
jobs:
  build:
    name: install-pip-packages
    runs-on: ubuntu-latest
    permissions:
      # contents permission to clone the repository
      contents: read
      packages: read
      # issues and pull-requests permissions to write results as pull
      # request comments. Omit them if you don't need summary comments
      issues: write
      pull-requests: write
      # To report GitHub Actions status checks. Omit if you don't need
      # to update commit status
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
      - name: Install pip Packages
        run: pip install ruff
      - name: Cache pip Packages
        id: cache-primes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: prime-numbers
          key: ${{ runner.os }}-pip
        timeout-minutes: 5
      - name: Run unimport check
        uses: ./
        with:
          extra_args: --include src/
        timeout-minutes: 5
