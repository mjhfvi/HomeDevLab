---
name: Workflow Ai PR-Agent
on:  # yamllint disable-line rule:truthy
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - 'config/**'
  # pull_request:
  #   branches: [main]
  #   types: [opened, synchronize]
  workflow_dispatch:
  workflow_call:  # Allows this workflow to be called and reused by other workflows
permissions: {}
jobs:
  build:
    name: ai-code-pr-agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: PR-Agent AI-powered code review agent
        uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
