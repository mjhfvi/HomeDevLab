---
name: Workflow Ai PR-Agent
on:  # yamllint disable-line rule:truthy
  # push:  # Triggers on any push event
  #   branches: [main]
  #   paths-ignore:
  #     - 'config/**'
  #     - 'config/local.json'
  #     - '/*.draft.md' # Ignores files matching extension globally
  # pull_request:
  #   branches: [main]
  #   types: [opened, synchronize]
  workflow_dispatch:  # Adds a "Run workflow" button in the GitHub Actions UI
  workflow_call:  # Allows this workflow to be called and reused by other workflows
  # schedule:
  #  # Runs at 00:00 every day
  #   - cron: '0 0 * * *'
permissions: {}
jobs:
  build:
    name: ai-pr-agent
    runs-on: ubuntu-latest
    permissions:
      # contents permission to clone the repository
      contents: read
      packages: read
      # issues and pull-requests permissions to write results as pull
      # request comments. Omit them if you don't need summary comments
      issues: write
      pull-requests: write
      # To report GitHub Actions status checks. Omit if you don't need
      # to update commit status
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: PR-Agent AI-powered code review agent
        uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
