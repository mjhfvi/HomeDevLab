---
name: Workflow Code Super Linter Full
on:  # yamllint disable-line rule:truthy
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:
  workflow_call:  # Allows this workflow to be called and reused by other workflows
permissions: {}
jobs:
  build:
    name: super-linter-full
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Super-linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: 'false'
          SAVE_SUPER_LINTER_SUMMARY: 'false'
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: 'false'
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: 'false'
          VALIDATE_ANSIBLE: 'true'
          VALIDATE_CHECKOV: 'true'
          VALIDATE_GROOVY: 'true'
          VALIDATE_JSON: 'true'
          VALIDATE_MARKDOWN: 'true'
          VALIDATE_TERRAFORM_FMT: 'true'
          VALIDATE_TERRAGRUNT: 'true'
          VALIDATE_YAML: 'true'
          VALIDATE_XML: 'true'
