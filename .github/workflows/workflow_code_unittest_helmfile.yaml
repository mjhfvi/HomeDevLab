---
name: Workflow Code UnitTest Helmfile CI
on:
  # push:
  #   branches: [ main ]
  #   paths:
  #     - '**/helmfile.yaml'
  # pull_request:
  #   branches: [ main ]
  #   paths:
  #     - '**/helmfile.yaml'
  workflow_dispatch:  # Adds a "Run workflow" button in the GitHub Actions UI
  workflow_call:  # Allows this workflow to be called and reused by other workflows
jobs:
  unittest:
    name: helmfile-unittest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: latest
      - name: Setup Helmfile
        uses: helmfile/helmfile-action@614b4cd063ada10b87f668f6ffd35485bce0cac5
      - name: Install helm-unittest Plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false
      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
      - name: List All Modified Files
        id: list-modified-files
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Modified file: $file"
            echo "MODIFIED-FILES=$file" >> $GITHUB_OUTPUT
          done
      - name: Find and Test helmfile.yaml Files
        run: |-
          # Find all files strictly matching 'helmfile.yaml'
          # This excludes 'helmfile.d/' configs or sub-files unless they are named exactly 'helmfile.yaml'
          FILES=${{ steps.list-modified-files.outputs.MODIFIED-FILES }}
          echo $FILES
