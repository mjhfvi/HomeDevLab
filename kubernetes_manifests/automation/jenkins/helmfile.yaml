---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only

filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn

helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300

repositories:
  - name: jenkins
    url: https://charts.jenkins.io/

releases:
  - name: jenkins
    namespace: automation
    chart: jenkins/jenkins
    version: 5.10.2
    # rollbackOnFailure: false
    labels:
      app.kubernetes.io/build-by: helmfile
      app.kubernetes.io/version: 5.10.2
      app.kubernetes.io/chart: jenkins
    values:
      - controller:
          admin:
            # -- Admin username created as a secret if `controller.admin.createSecret` is true
            username: "admin"
            # -- Admin password created as a secret if `controller.admin.createSecret` is true
            # @default -- <random password>
            password:

            # -- The key in the existing admin secret containing the username
            userKey: jenkins-admin-user
            # -- The key in the existing admin secret containing the password
            passwordKey: jenkins-admin-password

            # The default configuration uses this secret to configure an admin user
            # If you don't need that user or use a different security realm, then you can disable it
            # -- Create secret for admin user
            createSecret: true
            existingSecret: "jenkins-credentials"
          jenkinsAdminEmail: "mjhfvi@gmail.com"
          javaOpts: -Xms512m -Xmx1024m -XX:+AlwaysPreTouch -XX:+UseStringDeduplication -XX:+ParallelRefProcEnabled -XX:+DisableExplicitGC
