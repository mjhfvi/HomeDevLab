          JCasC:
            defaultConfig: true
            configScripts:
              jcasc-custom-config-jenkins: |
                jenkins:
                  systemMessage: "Welcome Back, Have A Nice Day!!"
                  globalNodeProperties:
                  - diskSpaceMonitor:
                      freeDiskSpaceThreshold: "5GiB"
                      freeDiskSpaceWarningThreshold: "10GiB"
                      freeTempSpaceThreshold: "5GiB"
                      freeTempSpaceWarningThreshold: "10GiB"
                  - envVars:
                      env:
                      - key: "PATH+EXTRA"
                        value: "/home/tzahi/.local/bin/"
                  clouds:
                  - kubernetes:
                      containerCap: 10
                      containerCapStr: "10"
                      jenkinsTunnel: "jenkins-main-agent.infrastructure.svc.cluster.local:50000"
                      jenkinsUrl: "http://jenkins-main.infrastructure.svc.cluster.local:8080"
                      name: "kubernetes"
                      namespace: "infrastructure"
                      podLabels:
                      - key: "jenkins/jenkins-main-jenkins-agent"
                        value: "true"
                      serverUrl: "https://kubernetes.default"
                      templates:
                      - containers:
                        - args: "^${computer.jnlpmac} ^${computer.name}"
                          envVars:
                          - envVar:
                              key: "JENKINS_URL"
                              value: "http://jenkins-main.infrastructure.svc.cluster.local:8080/"
                          image: "jenkins/inbound-agent:3385.vf1123fb_515da_-1"
                          name: "jnlp"
                          resourceLimitCpu: "512m"
                          resourceLimitMemory: "512Mi"
                          resourceRequestCpu: "512m"
                          resourceRequestMemory: "512Mi"
                          workingDir: "/home/jenkins/agent"
                        id: "95d21559f6381190c43a9aa24e40c4b09348e5a043c03a5d3e59615d2435de79"
                        label: "jenkins-main-jenkins-agent"
                        name: "default"
                        namespace: "infrastructure"
                        nodeUsageMode: NORMAL
                        podRetention: "never"
                        serviceAccount: "default"
                        slaveConnectTimeout: 100
                        slaveConnectTimeoutStr: "100"
                        yamlMergeStrategy: "override"
              jcasc-custom-config-credentials: |  # pragma: allowlist secret
                credentials:
                  system:
                    domainCredentials:
                    - credentials:
                      - basicSSHUserPrivateKey:
                          description: "GitHub SSH Access Credentials to JobAssignment Git"
                          id: "GitHub-SSH-Access-Credentials-to-JobAssignment-Git"
                          privateKeySource:
                            directEntry:
                              privateKey: "{}"
                          scope: GLOBAL
                          username: "mjhfvi@gmail.com"
                          usernameSecret: true
                      - usernamePassword:
                          description: "Docker Hub Login Credentials"
                          id: "Docker-Hub-Login-Credentials"
                          password: "{}"
                          scope: GLOBAL
                          username: "mjhfvi"
                          usernameSecret: true
                      - string:
                          description: "Private Aws Access Key"
                          id: "Aws-Access-Key"
                          scope: GLOBAL
                          secret: "{}"
                      - string:
                          description: "Private Aws Secret Key"
                          id: "Aws-Secret-Key"
                          scope: GLOBAL
                          secret: "{}"
              jcasc-custom-config-tools: |
                tool:
                  customTool:
                    installations:
                    - name: "Python"
                      properties:
                      - installSource:
                          installers:
                          - zip:
                              subdir: "Python-3.12.4"
                              url: "https://www.python.org/ftp/python/3.12.4/Python-3.12.4.tgz"
                    - name: "GitLeaks"
                      properties:
                      - installSource:
                          installers:
                          - zip:
                              label: "linux"
                              subdir: "gitleaks_8.18.3_linux_arm64"
                              url: "https://github.com/gitleaks/gitleaks/releases/download/v8.18.3/gitleaks_8.18.3_linux_arm64.tar.gz"
                    - name: "Autopep8"
                      properties:
                      - installSource:
                          installers:
                          - command:
                              command: "pip install --upgrade autopep8"
                              label: "linux"
                              toolHome: "/home/tzahi/.local/bin/"
                    - name: "Golangci-lint"
                      properties:
                      - installSource:
                          installers:
                          - zip:
                              label: "linux"
                              subdir: "golangci-lint-1.59.1-linux-amd64"
                              url: "https://github.com/golangci/golangci-lint/releases/download/v1.59.1/golangci-lint-1.59.1-linux-amd64.tar.gz"
                    - name: "Yamllint"
                      properties:
                      - installSource:
                          installers:
                          - command:
                              command: "pip install --upgrade yamllint"
                              label: "linux"
                              toolHome: "/home/tzahi/.local/bin/"
                    - name: "PreCommit"
                      properties:
                      - installSource:
                          installers:
                          - command:
                              command: |
                                pip install pre-commit
                              label: "linux"
                              toolHome: "/home/tzahi/.local/bin/"
                    - name: "Check-jsonschema"
                      properties:
                      - installSource:
                          installers:
                          - command:
                              command: "pip install --upgrade check-jsonschema"
                              label: "linux"
                              toolHome: "/home/tzahi/.local/bin/"
              jcasc-custom-config-appearance: |
                appearance:
                  pipelineGraphView:
                    showGraphOnBuildPage: false
                    showGraphOnJobPage: false
                  prism:
                    theme: PRISM
                  themeManager:
                    disableUserThemes: false
                    theme: "dark"
