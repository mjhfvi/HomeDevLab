---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only

filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn

helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
  # syncArgs:
  #   - "--labels=app.kubernetes.io/build-by=helmfile"

repositories:
  - name: milvus
    url: https://raw.githubusercontent.com/milvus-io/milvus-helm/gh-pages

# commonLabels:
#   app.kubernetes.io/build-by: helmfile
#   app.kubernetes.io/chart: milvus
#   app.kubernetes.io/chart-version: 4.0.31

releases:
  - name: milvus
    namespace: database
    chart: milvus/milvus
    version: 4.0.31
