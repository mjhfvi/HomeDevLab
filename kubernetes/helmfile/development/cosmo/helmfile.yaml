---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn
helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
# repositories:
#   - name: cosmo
#     url: https://wiremind.github.io/wiremind-helm-charts
releases:
  - name: cosmo
    namespace: security
    createNamespace: true
    chart: oci://ghcr.io/wundergraph/cosmo/helm-charts/cosmo
    labels:
      app.kubernetes.io/name: cosmo
      app.kubernetes.io/instance: cosmo
      app.kubernetes.io/version: 0.16.0
      app.kubernetes.io/managed-by: helmfile
    version: 0.16.0
    values: [..\..\..\manifests\security\cosmo\values.yaml]
