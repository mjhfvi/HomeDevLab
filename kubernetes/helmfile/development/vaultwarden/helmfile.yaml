---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn
helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
repositories:
  - name: vaultwarden
    url: https://guerzon.github.io/vaultwarden
releases:
  - name: vaultwarden
    namespace: security
    createNamespace: true
    chart: vaultwarden/vaultwarden
    version: 0.34.5
    labels:
      app.kubernetes.io/build-by: helmfile
      app.kubernetes.io/chart: vaultwarden
      app.kubernetes.io/chart-version: 0.34.5
    values: [..\..\..\manifests\security\vaultwarden\values.yaml]
