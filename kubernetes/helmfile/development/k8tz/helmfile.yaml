---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn
helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
repositories:
  - name: k8tz
    url: https://k8tz.github.io/k8tz/
releases:
  - name: k8tz
    namespace: infrastructure
    createNamespace: true
    chart: k8tz/k8tz
    # version: 3.7.0
    # rollbackOnFailure: false
    labels:
      app.kubernetes.io/build-by: helmfile
      app.kubernetes.io/chart: k8tz
      # app.kubernetes.io/chart-version: 3.7.0
    values: [..\..\..\manifests\infrastructure\k8tz\values.yaml]
