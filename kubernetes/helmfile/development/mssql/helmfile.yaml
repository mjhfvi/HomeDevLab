---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn
helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
# repositories:
#   - name: mssql
#     url: oci://registry.gitlab.com/xrow-public/helm-mssql/charts/mssql
releases:
  - name: mssql
    namespace: database
    chart: oci://registry.gitlab.com/xrow-public/helm-mssql/charts/mssql
    version: 1.10.3
    # rollbackOnFailure: false
    labels:
      app.kubernetes.io/build-by: helmfile
      app.kubernetes.io/chart: mssql
      app.kubernetes.io/chart-version: 1.10.3
    values: [..\..\..\manifests\database\mssql\values.yaml]
