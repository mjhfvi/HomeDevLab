---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn
helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
repositories:
  - name: flux-operator
    url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
releases:
  - name: flux-operator
    namespace: delivery
    createNamespace: true
    chart: flux-operator/flux-operator
    # version: 0.20.0
    labels:
      app.kubernetes.io/build-by: helmfile
      # app.kubernetes.io/version: 0.20.0
      app.kubernetes.io/chart: fluent-bit
    values: [..\..\..\manifests\delivery\flux-operator\values.yaml]
