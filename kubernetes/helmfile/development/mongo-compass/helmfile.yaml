---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn
helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
repositories:
  - name: mongo-compass
    url: https://antiantiops.github.io/mongo-compass-web-helm
releases:
  - name: mongo-compass
    namespace: tools
    createNamespace: true
    chart: mongo-compass/mongo-compass
    version: 1.1.4
    # rollbackOnFailure: false
    labels:
      app.kubernetes.io/build-by: helmfile
      app.kubernetes.io/chart: mongo-compass
      app.kubernetes.io/chart-version: 1.1.4
    values: [..\..\..\manifests\tools\mongo-compass\values.yaml]
