---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn
helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
repositories:
  - name: fluent-bit
    url: https://fluent.github.io/helm-charts/
releases:
  - name: fluent-bit
    namespace: observability
    createNamespace: true
    chart: fluent/fluent-bit
    # version: 0.20.0
    labels:
      app.kubernetes.io/build-by: helmfile
      # app.kubernetes.io/version: 0.20.0
      app.kubernetes.io/chart: fluent-bit
    values: [..\..\..\manifests\observability\fluent-bit\values.yaml]
