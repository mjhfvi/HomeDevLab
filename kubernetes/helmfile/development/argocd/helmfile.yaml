---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
# kustomizeBinary: kustomize
helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
releases:
  - name: argocd
    namespace: delivery
    createNamespace: true
    chart: argo/'{{`{{ .Release.Name }}`}}'
    labels:
      app.kubernetes.io/build-by: helmfile
      # app.kubernetes.io/version: '{{`{{ .Release.ChartVersion }}`}}'
      app.kubernetes.io/chart: '{{`{{ .Release.Name }}`}}'
      values: [..\..\..\manifests\delivery\argocd\argocd\values.yaml]
