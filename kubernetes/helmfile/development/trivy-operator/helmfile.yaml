---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn
helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
repositories:
  - name: trivy
    url: https://aquasecurity.github.io/helm-charts/
releases:
  - name: trivy
    namespace: security
    createNamespace: true
    chart: trivy/trivy-operator
    # version: 2.0.14
    labels:
      app.kubernetes.io/build-by: helmfile
      app.kubernetes.io/chart: trivy-operator
      # app.kubernetes.io/chart-version: 2.0.14
    values: [..\..\..\manifests\security\trivy-operator\values.yaml]
