---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn
helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
repositories:
  - name: pgadmin4
    url: https://helm.runix.net/
releases:
  - name: pgadmin4
    namespace: tools
    createNamespace: true
    chart: pgadmin4/pgadmin4
    version: 15.4.2
    # rollbackOnFailure: false
    labels:
      app.kubernetes.io/build-by: helmfile
      app.kubernetes.io/chart: pgadmin4
      # app.kubernetes.io/chart-version: 15.4.2
    values: [..\..\..\manifests\tools\pgadmin4\values.yaml]
