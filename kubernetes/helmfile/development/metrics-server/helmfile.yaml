---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn
helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
repositories:
  - name: kubernetes-sigs
    url: https://kubernetes-sigs.github.io/metrics-server/
releases:
  - name: metrics-server
    namespace: observability
    createNamespace: true
    chart: kubernetes-sigs/metrics-server
    # version: v0.16.0
    # rollbackOnFailure: false
    labels:
      app.kubernetes.io/build-by: helmfile
      # app.kubernetes.io/version: v0.16.0
      app.kubernetes.io/chart: metrics-server
    values: [..\..\..\manifests\observability\metrics-server\values.yaml]
