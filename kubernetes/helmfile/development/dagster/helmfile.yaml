---
# helmfile apply  # Apply all resources from state file only when there are changes
# helmfile sync  # Sync releases defined in state file
# helmfile destroy  # Destroys and then purges releases
# configuration:  https://helmfile.readthedocs.io/en/latest/configuration/#full-reference
helmDefaults:
  verify: false
  force: false
  cleanupOnFail: false
  skipDeps: false
  wait: true
  deleteWait: false
  deleteTimeout: 300
  timeout: 600
  waitForJobs: true
  historyMax: 10
  createNamespace: true
commonLabels:
  app.helmfile.io/build-by: helmfile
  app.helmfile.io/chart: '{{ .Release.Name }}'
  app.helmfile.io/version: '{{ .Release.ChartVersion }}'
repositories:
  - name: dagster
    url: https://dagster-io.github.io/helm
    oci: false
releases:
  - name: dagster
    namespace: automation
    chart: '{{ .Release.Name }}/{{ .Release.Name }}'
    version: 1.13.27
    values:
      - ../../../manifests/{{ .Release.Namespace }}/{{ .Release.Name }}/values.yaml
