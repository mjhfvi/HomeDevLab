---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-webui-ollama
  labels:
    app: open-webui-ollama
    app.kubernetes.io/component: open-webui-ollama
    app.kubernetes.io/instance: open-webui-ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: open-webui-ollama
    app.kubernetes.io/part-of: open-webui
    helm.sh/chart: open-webui-ollama-1.0.6
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
      # - pods
      # - pods/log
      # - deployments
      # - ingresses
      # - configmaps
      # - events
      # - nodes
      # - persistentvolumeclaims
    verbs:
      - get
      - watch
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-webui-ollama
subjects:
  - kind: ServiceAccount
    name: open-webui-ollama
    namespace: argo-workflows
roleRef:
  kind: ClusterRole
  name: open-webui-ollama
  apiGroup: rbac.authorization.k8s.io

