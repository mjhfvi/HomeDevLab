---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  # annotations:
  #   karpenter.sh/nodepool-hash: '16125220425220403094'
  #   karpenter.sh/nodepool-hash-version: v3
  name: gpu-pool
spec:
  disruption:
    budgets:
      - nodes: 10%
    consolidateAfter: 1m
    consolidationPolicy: WhenEmptyOrUnderutilized
    # template:
    #   metadata:
    #     labels:
    #       workload: nodes-gpu-isolated
    spec:
      expireAfter: 336h
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      requirements:
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: [g, p]
        - key: eks.amazonaws.com/instance-cpu
          operator: In
          values: ['4', '8']
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
      taints:
        - effect: NoSchedule
          key: nvidia.com/gpu
          value: 'true'
      terminationGracePeriod: 24h0m0s
