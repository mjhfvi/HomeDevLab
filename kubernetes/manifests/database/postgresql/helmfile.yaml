---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only

filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn

helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
  # syncArgs:
  #   - "--labels=app.kubernetes.io/build-by=helmfile"

repositories:
  - name: helmforge
    url: https://repo.helmforge.dev

# commonLabels:
#   app.kubernetes.io/build-by: helmfile
#   app.kubernetes.io/chart: postgresql
#   app.kubernetes.io/chart-version: 2.1.1

releases:
  - name: postgresql
    namespace: database
    chart: helmforge/postgresql
    version: 2.1.1
    # rollbackOnFailure: false
    # labels:
    #   app.kubernetes.io/build-by: helmfile
    #   app.kubernetes.io/chart: postgresql
    #   app.kubernetes.io/chart-version: 2.1.1
    values:
      - auth:
          existingSecret: "postgresql-credentials"
