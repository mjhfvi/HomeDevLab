---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn
helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300
repositories:
  - name: helmforge
    url: https://repo.helmforge.dev
# commonLabels:
#   app.kubernetes.io/build-by: helmfile
#   app.kubernetes.io/chart: mongodb
#   app.kubernetes.io/chart-version: 1.8.7
releases:
  - name: mongodb
    namespace: database
    chart: helmforge/mongodb
    version: 1.8.7
    # rollbackOnFailure: false
    # labels:
    #   app.kubernetes.io/build-by: helmfile
    #   app.kubernetes.io/chart: mongodb
    #   app.kubernetes.io/chart-version: 1.8.7
    values: [credentials.yaml, values.yaml]
