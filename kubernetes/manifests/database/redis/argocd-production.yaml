---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: infrastructure
  labels:
    argocd.argoproj.io/environment: production
    argocd.argoproj.io/stage: stable
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  source:
    path: ''
    repoURL: ''
    targetRevision: main
  sources:
    - name: redis
      repoURL: https://repo.helmforge.dev
      chart: redis
      targetRevision: 3.1.1
      helm:
        releaseName: values
        valueFiles: [$values/kubernetes/manifests/database/redis/values.yaml]
    - name: values
      repoURL: https://github.com/mjhfvi/HomeDevLab
      path: kubernetes/manifests/database/redis
      targetRevision: main
      ref: values
      directory:
        recurse: true
        include: '{*.yaml,*.yml}'
        exclude: '{*.md,helmfile.yaml,.helmignore,values.example.yaml}'
  project: homedevlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions: [CreateNamespace=true, PruneLast=true, Replace=true]
