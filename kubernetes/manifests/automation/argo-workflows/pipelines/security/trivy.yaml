---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: trivy-
  namespace: argo-workflows
spec:
  serviceAccountName: argo-workflows-server-controller
  nodeSelector:
    octopus.infrastructure.as.code/node-instance-purpose: general-purpose-pool
  entrypoint: trivy-template # workflow entry point template
  ttlStrategy:
    secondsAfterCompletion: 300
  podGC:
    strategy: OnWorkflowCompletion
  templates:
    - name: trivy-template
      steps:
        - - name: trivy-summary
            template: run-command
            arguments:
              parameters:
                - name: command
                  value: kubernetes --report=summary
          - name: trivy-vuln
            template: run-command
            arguments:
              parameters:
                - name: command
                  value: kubernetes --scanners vuln  --report all
          - name: trivy-misconfig
            template: run-command
            arguments:
              parameters:
                - name: command
                  value: kubernetes --scanners misconfig  --report all
    - name: run-command
      inputs:
        parameters:
          - name: command
      container:
        image: aquasec/trivy:0.69.3
        command:
          - sh
          - -c
        args:
          - trivy {{inputs.parameters.command}}
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 250m
            memory: 64Mi
