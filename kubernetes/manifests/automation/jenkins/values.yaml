  # Below is the implementation of Jenkins Configuration as Code. Add a key under configScripts for each configuration area,
  # where each corresponds to a plugin or section of the UI. Each key (prior to | character) is just a label, and can be any value.
  # Keys are only used to give the section a meaningful name. The only restriction is they may only contain RFC 1123 \ DNS label
  # characters: lowercase letters, numbers, and hyphens. The keys become the name of a configuration yaml file on the controller in
  # /var/jenkins_home/casc_configs (by default) and will be processed by the Configuration as Code Plugin. The lines after each |
  # become the content of the configuration yaml file. The first line after this is a JCasC root element, e.g., jenkins, credentials,
  # etc. Best reference is https://<jenkins_url>/configuration-as-code/reference. The example below creates a welcome message:
  JCasC:
    # -- Enables default Jenkins configuration via configuration as code plugin
    defaultConfig: true

    # - https://acme.org/jenkins.yaml
    # -- List of Jenkins Config as Code scripts
    configScripts:
      jcasc-custom-config-jenkins: |
        jenkins:
          systemMessage: "Welcome Back, Have A Nice Day!!"
          globalNodeProperties:
          - diskSpaceMonitor:
              freeDiskSpaceThreshold: "5GiB"
              freeDiskSpaceWarningThreshold: "10GiB"
              freeTempSpaceThreshold: "5GiB"
              freeTempSpaceWarningThreshold: "10GiB"
          - envVars:
              env:
              - key: "PATH+EXTRA"
                value: "/home/tzahi/.local/bin/"
          clouds:
          - kubernetes:
              containerCap: 10
              containerCapStr: "10"
              jenkinsTunnel: "jenkins-main-agent.infrastructure.svc.cluster.local:50000"
              jenkinsUrl: "http://jenkins-main.infrastructure.svc.cluster.local:8080"
              name: "kubernetes"
              namespace: "infrastructure"
              podLabels:
              - key: "jenkins/jenkins-main-jenkins-agent"
                value: "true"
              serverUrl: "https://kubernetes.default"
              templates:
              - containers:
                - args: "^${computer.jnlpmac} ^${computer.name}"
                  envVars:
                  - envVar:
                      key: "JENKINS_URL"
                      value: "http://jenkins-main.infrastructure.svc.cluster.local:8080/"
                  image: "jenkins/inbound-agent:3385.vf1123fb_515da_-1"
                  name: "jnlp"
                  resourceLimitCpu: "512m"
                  resourceLimitMemory: "512Mi"
                  resourceRequestCpu: "512m"
                  resourceRequestMemory: "512Mi"
                  workingDir: "/home/jenkins/agent"
                id: "95d21559f6381190c43a9aa24e40c4b09348e5a043c03a5d3e59615d2435de79"
                label: "jenkins-main-jenkins-agent"
                name: "default"
                namespace: "infrastructure"
                nodeUsageMode: NORMAL
                podRetention: "never"
                serviceAccount: "default"
                slaveConnectTimeout: 100
                slaveConnectTimeoutStr: "100"
                yamlMergeStrategy: "override"
      jcasc-custom-config-credentials: |  # pragma: allowlist secret
        credentials:
          system:
            domainCredentials:
            - credentials:
              - basicSSHUserPrivateKey:
                  description: "GitHub SSH Access Credentials to JobAssignment Git"
                  id: "GitHub-SSH-Access-Credentials-to-JobAssignment-Git"
                  privateKeySource:
                    directEntry:
                      privateKey: "{}"
                  scope: GLOBAL
                  username: "mjhfvi@gmail.com"
                  usernameSecret: true
              - usernamePassword:
                  description: "Docker Hub Login Credentials"
                  id: "Docker-Hub-Login-Credentials"
                  password: "{}"
                  scope: GLOBAL
                  username: "mjhfvi"
                  usernameSecret: true
              - string:
                  description: "Private Aws Access Key"
                  id: "Aws-Access-Key"
                  scope: GLOBAL
                  secret: "{}"
              - string:
                  description: "Private Aws Secret Key"
                  id: "Aws-Secret-Key"
                  scope: GLOBAL
                  secret: "{}"
      jcasc-custom-config-tools: |
        tool:
          customTool:
            installations:
            - name: "Python"
              properties:
              - installSource:
                  installers:
                  - zip:
                      subdir: "Python-3.12.4"
                      url: "https://www.python.org/ftp/python/3.12.4/Python-3.12.4.tgz"
            - name: "GitLeaks"
              properties:
              - installSource:
                  installers:
                  - zip:
                      label: "linux"
                      subdir: "gitleaks_8.18.3_linux_arm64"
                      url: "https://github.com/gitleaks/gitleaks/releases/download/v8.18.3/gitleaks_8.18.3_linux_arm64.tar.gz"
            - name: "Autopep8"
              properties:
              - installSource:
                  installers:
                  - command:
                      command: "pip install --upgrade autopep8"
                      label: "linux"
                      toolHome: "/home/tzahi/.local/bin/"
            - name: "Golangci-lint"
              properties:
              - installSource:
                  installers:
                  - zip:
                      label: "linux"
                      subdir: "golangci-lint-1.59.1-linux-amd64"
                      url: "https://github.com/golangci/golangci-lint/releases/download/v1.59.1/golangci-lint-1.59.1-linux-amd64.tar.gz"
            - name: "Yamllint"
              properties:
              - installSource:
                  installers:
                  - command:
                      command: "pip install --upgrade yamllint"
                      label: "linux"
                      toolHome: "/home/tzahi/.local/bin/"
            - name: "PreCommit"
              properties:
              - installSource:
                  installers:
                  - command:
                      command: |
                        pip install pre-commit
                      label: "linux"
                      toolHome: "/home/tzahi/.local/bin/"
            - name: "Check-jsonschema"
              properties:
              - installSource:
                  installers:
                  - command:
                      command: "pip install --upgrade check-jsonschema"
                      label: "linux"
                      toolHome: "/home/tzahi/.local/bin/"
      jcasc-custom-config-appearance: |
        appearance:
          pipelineGraphView:
            showGraphOnBuildPage: false
            showGraphOnJobPage: false
          prism:
            theme: PRISM
          themeManager:
            disableUserThemes: false
            theme: "dark"
      jcasc-custom-config-unclassified: |
        unclassified:
          ansiColorBuildWrapper:
            colorMaps:
            - black: "#000000"
              blackB: "#4C4C4C"
              blue: "#1E90FF"
              blueB: "#4682B4"
              cyan: "#00CDCD"
              cyanB: "#00FFFF"
              green: "#00CD00"
              greenB: "#00FF00"
              magenta: "#CD00CD"
              magentaB: "#FF00FF"
              name: "xterm"
              red: "#CD0000"
              redB: "#FF0000"
              white: "#E5E5E5"
              whiteB: "#FFFFFF"
              yellow: "#CDCD00"
              yellowB: "#FFFF00"
            - black: "#000000"
              blackB: "#555555"
              blue: "#0000AA"
              blueB: "#5555FF"
              cyan: "#00AAAA"
              cyanB: "#55FFFF"
              defaultBackground: 0
              defaultForeground: 7
              green: "#00AA00"
              greenB: "#55FF55"
              magenta: "#AA00AA"
              magentaB: "#FF55FF"
              name: "vga"
              red: "#AA0000"
              redB: "#FF5555"
              white: "#AAAAAA"
              whiteB: "#FFFFFF"
              yellow: "#AA5500"
              yellowB: "#FFFF55"
            - black: "black"
              blackB: "black"
              blue: "blue"
              blueB: "blue"
              cyan: "cyan"
              cyanB: "cyan"
              green: "green"
              greenB: "green"
              magenta: "magenta"
              magentaB: "magenta"
              name: "css"
              red: "red"
              redB: "red"
              white: "white"
              whiteB: "white"
              yellow: "yellow"
              yellowB: "yellow"
            - black: "#2E3436"
              blackB: "#2E3436"
              blue: "#3465A4"
              blueB: "#3465A4"
              cyan: "#06989A"
              cyanB: "#06989A"
              defaultBackground: 0
              defaultForeground: 7
              green: "#4E9A06"
              greenB: "#4E9A06"
              magenta: "#75507B"
              magentaB: "#75507B"
              name: "gnome-terminal"
              red: "#CC0000"
              redB: "#CC0000"
              white: "#D3D7CF"
              whiteB: "#D3D7CF"
              yellow: "#C4A000"
              yellowB: "#C4A000"
            globalColorMapName: "xterm"
          scmGit:
            globalConfigEmail: "mjhfvi@gmail.com"
            globalConfigName: "Tzahi Cohen"
          globalLibraries:
            libraries:
            - defaultVersion: "main"
              implicit: true
              name: "Jenkins-Shared-Library"
              retriever:
                modernSCM:
                  clone: true
                  libraryPath: "GlobalSharedLibraries/"
                  scm:
                    git:
                      id: "6bcd3dda-0e2f-4d12-8519-063a1dde5457"
                      remote: "https://github.com/mjhfvi/JenkinsExamples.git"
                      traits:
                      - "gitBranchDiscovery"
