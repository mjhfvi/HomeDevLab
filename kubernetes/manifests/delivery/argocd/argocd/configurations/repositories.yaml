---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-homedevlab-kubernetes-manifests
  namespace: infrastructure
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: homedevlab-kubernetes-manifests
  url: https://github.com/mjhfvi/HomeDevLab
  # username: gitops-user
  # password: <TOKEN>
  # bearerToken: my-token
  tlsClientCertKey: |  # pragma: allowlist secret
    -----BEGIN OPENSSH PRIVATE KEY-----

    -----END OPENSSH PRIVATE KEY-----
  type: git
  project: homedevlab
  # enableOCI: "true" # Default: "false", set to "true" to enable OCI support for this repository
  # insecure: "true" # Ignore validity of server's TLS certificate. Defaults to "false"
  # forceHttpBasicAuth: "true" # Skip auth method negotiation and force usage of HTTP basic auth. Defaults to "false"
  # enableLfs: "true" # Enable git-lfs for this repository. Defaults to "false"
