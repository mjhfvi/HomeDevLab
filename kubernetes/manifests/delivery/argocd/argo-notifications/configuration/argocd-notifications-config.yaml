apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: infrastructure
data:
  service.email: |
    host: email-smtp.us-east-1.amazonaws.com
    port: 587
    from: Argo-Notifications@app.com
    username: $email-username
    password: $email-password
  template.app-sync-succeeded: |
    message: |
      Application {{.app.metadata.name}} has been successfully synced.
  trigger.on-sync-failed: |
    - description: Application syncing has failed
      send: [app-sync-failed]
      when: app.status.operationState.phase in ['Error', 'Failed']
  trigger.on-sync-succeeded: |
    - description: Application syncing has succeeded
      send: [app-sync-succeeded]
      when: app.status.operationState.phase in ['Succeeded']

---
# - when: workflow.status in ['Succeeded', 'Failed', 'Error']
#   send: [workflow-status]

# - when: workflow.status in ['Succeeded', 'Failed', 'Error']
#   send: [workflow-status]
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: infrastructure
type: Opaque
stringData:
  email-username: ""
  email-password: ""

# https://oneuptime.com/blog/post/2026-02-26-argocd-notifications-email/view
