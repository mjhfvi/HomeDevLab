---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: argocd-image-updater
  namespace: infrastructure
spec:
  namespace: ai  # deprecated and optional. The controller now uses the ImageUpdater CR's metadata.namespace field to determine which namespace to search for Argo CD Applications
  commonUpdateSettings:
    updateStrategy: semver  # Default: "semver" - "latest" (Update to the most recently built image found in a registry), "digest" (Update to the latest version of a given version (tag), using the tag's SHA digest), "semver" (Update to the latest version of an image considering semantic versioning constraints), "name" (Sorts tags alphabetically and update to the one with the highest cardinality)
    forceUpdate: false  # Default: false, type boolean
    allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$  # Default: all tags
    ignoreTags: [latest, dev]  # Default: no tags ignored
    # pullSecret: "infrastructure/ghcr-registry-secret" # Default: no pull secret
    platforms: []  # Default: no platform restrictions
  writeBackConfig:
    method: git  # Default: "argocd" - "git" (Write back changes to a git repository, creating a pull request), "argocd" (Write back changes directly to the Argo CD Application manifest in the cluster)
    gitConfig:
      repository: https://github.com/appdev/devops-kubernetes-clusters-manifests.git
      branch: main
  applicationRefs:
    - namePattern: ai-agents  # Select application name in ArgoCD matching this pattern
      images:
        - alias: ai-agents
          imageName: ghcr.io/appdev/ai-agents  # Docker Image name with tag, digest or both. The tag and digest are optional, but at least one of them must be specified.
    - namePattern: ai-forecast  # Select application name in ArgoCD matching this pattern
      images:
        - alias: ai-forecast
          imageName: ghcr.io/appdev/ai-forecast  # Docker Image name with tag, digest or both. The tag and digest are optional, but at least one of them must be specified.
    - namePattern: ai-mcpserver  # Select application name in ArgoCD matching this pattern
      images:
        - alias: ai-mcpserver
          imageName: ghcr.io/appdev/ai-mcpserver  # Docker Image name with tag, digest or both. The tag and digest are optional, but at least one of them must be specified.
    - namePattern: ai-videochat-agents  # Select application name in ArgoCD matching this pattern
      images:
        - alias: ai-videochat-agents
          imageName: ghcr.io/appdev/ai-videochat-agents  # Docker Image name with tag, digest or both. The tag and digest are optional, but at least one of them must be specified.
    - namePattern: .ai.assistant  # Select application name in ArgoCD matching this pattern
      images:
        - alias: .ai.assistant
          imageName: ghcr.io/appdev/.ai.assistant  # Docker Image name with tag, digest or both. The tag and digest are optional, but at least one of them must be specified.
    - namePattern: .pdf.chat  # Select application name in ArgoCD matching this pattern
      images:
        - alias: .pdf.chat
          imageName: ghcr.io/appdev/.pdf.chat  # Docker Image name with tag, digest or both. The tag and digest are optional, but at least one of them must be specified.
    - namePattern: .ingestion.service  # Select application name in ArgoCD matching this pattern
      images:
        - alias: .ingestion.service
          imageName: ghcr.io/appdev/.ingestion.service  # Docker Image name with tag, digest or both. The tag and digest are optional, but at least one of them must be specified.
---
