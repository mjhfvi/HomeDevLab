---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-ingressroute
  # namespace: management
spec:
  entryPoints:
    - web
    # - websecure
  routes:
    - match: Host(`urls.eks-dev-il.octopus-cloud.com`)
      kind: Rule
      services:
        - kind: Service
          name: homepage
          port: 3000
          namespace: management
      observability:
        accessLogs: true
      # middlewares:
