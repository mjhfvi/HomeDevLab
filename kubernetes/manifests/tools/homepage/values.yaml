---
nodeSelector:
  octopus.infrastructure.as.code/node-instance-purpose: general-purpose-pool
service:
  type: ClusterIP
  port: 3000
  annotations: {}
ingress:
  main:
    enabled: true
    className: traefik
    # annotations:
    #   traefik.ingress.kubernetes.io/whitelist-source-range: "127.0.0.1/32"
    hosts:
      - host: urls.eks-dev-il.octopus-cloud.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
# podAnnotations:
#   traefik.ingress.kubernetes.io/router.middlewares: ingress-traefik-secureheaders@kubernetescrd
persistence:
  config:
    enabled: false
    accessMode: ReadWriteOnce
    size: 1Gi
    # storageClass: ""
env:
  - name: LOG_TARGETS
    value: stdout
  # Add your ingress hostname here
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: urls.eks-dev-il.octopus-cloud.com
config:
  settings:
    title: EKS Homepage
    description: Octopus EKS homepage
    background: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
    favicon: https://www.google.com/favicon.ico
    theme: dark  # or light
    color: slate  # Supported colors are: slate, gray, zinc, neutral, stone, amber, yellow, lime, green, emerald, teal, cyan, sky, blue, indigo, violet, purple, fuchsia, pink, rose, red, white
    layout:
      Octopus:
        icon: docker-compose.png  # https://dashboardicons.com/icons
        header: false
        headerStyle: boxedWidgets # either "boxedWidgets" or "underlined" or "clean" or "boxed"
        groupsInitiallyCollapsed: true
        initiallyCollapsed: false
        tab: Octopus
        style: column  # either "column" or "row" based layouts
        # columns: 4  # number of columns for row based layout
      Infrastructure:
        icon: azure-kubernetes-services.png  # https://dashboardicons.com/icons
        header: false
        headerStyle: underlined # either "boxedWidgets" or "underlined" or "clean"
        initiallyCollapsed: false
        tab: Infrastructure
        style: column
        # columns: 6
  widgets:
    - greeting:
        text_size: xl
        text: EKS Dev
    - logo:
        icon: https://octopus-app.com/wp-content/uploads/2025/03/octopus_logo.svg
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short
          hourCycle: h23
        locale: il
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: aws-dev-01-il-central-1
        nodes:
          show: false
          cpu: true
          memory: true
          showLabel: true
    # - resources:
    #     backend: resources
    #     expanded: true
    #     cpu: true
    #     memory: true
    #     network: default
  kubernetes:
    mode: cluster
    ingress: true
    # gateway: true
