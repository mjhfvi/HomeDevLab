---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redisinsight
  namespace: infrastructure
  labels:
    argocd.argoproj.io/environment: development
    argocd.argoproj.io/stage: testing
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: tools
  source:
    path: ''
    repoURL: ''
    targetRevision: main
  sources:
    - name: redisinsight
      repoURL: https://mrnim94.github.io/redisinsight
      chart: redisinsight
      targetRevision: 1.70.4
      helm:
        releaseName: values
        valueFiles: [$values/kubernetes/manifests/tools/redisinsight/values.yaml]
    - name: values
      repoURL: https://github.com/mjhfvi/HomeDevLab
      path: kubernetes/manifests/tools/redisinsight
      targetRevision: main
      ref: values
      directory:
        recurse: false
        include: '*.{yaml,yml}'
        exclude: '{*.md,.helmignore,Chart.{yaml,yml},helmfile.{yaml,yml},values.example.{yaml,yml},argocd-production.{yaml,yml}}'
  project: homedevlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions: [CreateNamespace=true, PruneLast=true, Replace=true]
