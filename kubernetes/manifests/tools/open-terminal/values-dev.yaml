applicationName: "terminal"
ingress:
  # -- (bool) Enable Ingress.
  # @section -- Ingress Parameters
  enabled: true
  # -- (string) Name of the ingress class.
  # @section -- Ingress Parameters
  ingressClassName: "traefik"
  hosts:
    - # -- (tpl/string) Hostname.
      # @section -- Ingress Parameters
      host: "terminal.eks-dev-il.octopus-cloud.com"
      paths:
        - # -- (string) Path.
          # @section -- Ingress Parameters
          path: /
          # -- (string) Path type.
          # @default -- `ImplementationSpecific`
          # @section -- Ingress Parameters
          # pathType: ImplementationSpecific
          # -- (string) Service name.
          # @default -- `{{ include "application.name" $ }}`
          # @section -- Ingress Parameters
          # serviceName: http
          # -- (string) Service port.
          # @default -- `http`
          # @section -- Ingress Parameters
          # servicePort: "8080"
deployment:
  nodeSelector:
    octopus.infrastructure.as.code/node-instance-purpose: general-purpose-pool
  image:
    repository: "raonigabriel/web-terminal"
    tag: "latest"
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  ports:
    - containerPort: 7681
      name: http
      protocol: TCP
  # - containerPort: 8443
  #   name: https
  #   protocol: TCP
service:
  enabled: true
  ports:
    - port: 8080
      name: http
      protocol: TCP
      targetPort: 7681
