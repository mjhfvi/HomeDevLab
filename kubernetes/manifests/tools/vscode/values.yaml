---
applicationName: vscode
ingress:
  # -- (bool) Enable Ingress.
  # @section -- Ingress Parameters
  enabled: true
  # -- (string) Name of the ingress class.
  # @section -- Ingress Parameters
  ingressClassName: traefik
  hosts:
      # -- (tpl/string) Hostname.
      # @section -- Ingress Parameters
    - host: vscode.eks-dev-il.cloud.com
      paths:
          # -- (string) Path.
          # @section -- Ingress Parameters
        - path: /
          # -- (string) Path type.
          # @default -- `ImplementationSpecific`
          # @section -- Ingress Parameters
          # pathType: ImplementationSpecific
          # -- (string) Service name.
          # @default -- `{{ include "application.name" $ }}`
          # @section -- Ingress Parameters
          # serviceName: http
          # -- (string) Service port.
          # @default -- `http`
          # @section -- Ingress Parameters
          # servicePort: "8080"
deployment:
  nodeSelector:
    infrastructure.as.code/node-instance-purpose: general-purpose-pool
  image:
    repository: linuxserver/code-server
    tag: 4.112.0
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  ports:
    - containerPort: 8443
      name: http
      protocol: TCP
  # - containerPort: 8443
  #   name: https
  #   protocol: TCP
  env:
    SUDO_PASSWORD:
      value: password
service:
  enabled: true
  ports:
    - port: 8443
      name: http
      protocol: TCP
      targetPort: 8443
# docker run -d \
#   --name=code-server \
#   -e PUID=1000 \
#   -e PGID=1000 \
#   -e TZ=Etc/UTC \
#   -e PASSWORD=password `#optional` \
#   -e HASHED_PASSWORD= `#optional` \
#   -e SUDO_PASSWORD=password `#optional` \
#   -e SUDO_PASSWORD_HASH= `#optional` \
#   -e PROXY_DOMAIN=code-server.my.domain `#optional` \
#   -e DEFAULT_WORKSPACE=/config/workspace `#optional` \
#   -e PWA_APPNAME=code-server `#optional` \
#   -p 8443:8443 \
#   -v /path/to/code-server/config:/config \
#   --restart unless-stopped \
#   lscr.io/linuxserver/code-server:latest
