---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-redis
  namespace: infrastructure
spec:
  project: homedevlab
  source:
    repoURL: https://github.com/mjhfvi/HomeDevLab.git
    targetRevision: main
    path: database/redis
    directory:
      recurse: false
      include: '{argocd.yaml,argocd.yml}'
      exclude: '{*.json,*.lock}'
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
