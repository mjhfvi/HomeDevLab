# SPDX-License-Identifier: Apache-2.0
# =============================================================================
# Redis Helm Chart - Default Values
# =============================================================================
# Supported architectures:
# - standalone
# - replication
# - sentinel
# - cluster

# -- Redis topology to deploy: standalone | replication | sentinel | cluster
architecture: standalone

# -- Override full release name
fullnameOverride: "redis"

auth:
  # -- Enable password authentication
  enabled: false

# =============================================================================
# Standalone
# =============================================================================

standalone:
  persistence:
    enabled: false
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  resources: {}

# =============================================================================
# Replication
# =============================================================================

replication:
  replicaCount: 2 # minimum: 2
  primary:
    persistence:
      enabled: false
  replica:
    persistence:
      enabled: false

# =============================================================================
# Sentinel data nodes
# =============================================================================

node:
  # -- Number of role-neutral Redis data nodes in Sentinel mode
  replicaCount: 1
  persistence:
    # -- Enable persistent storage for Sentinel data nodes
    enabled: false

# =============================================================================
# Sentinel
# =============================================================================

sentinel:
  replicaCount: 1
