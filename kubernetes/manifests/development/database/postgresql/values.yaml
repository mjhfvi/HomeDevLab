# =============================================================================
# PostgreSQL Helm Chart - Default Values
# =============================================================================
# Supported architectures:
# - standalone
# - replication

# -- PostgreSQL deployment mode: standalone | replication
architecture: standalone

# -- Override chart name
nameOverride: "postgresql"

auth:
  # -- Existing secret with PostgreSQL passwords
  existingSecret: "postgresql-credentials"

standalone:
  persistence:
    # -- Enable PVC for standalone mode
    enabled: false

replication:
  primary:
    persistence:
      # -- Enable PVC for the primary StatefulSet
      enabled: false
  readReplicas:
    persistence:
      # -- Enable PVCs for read replicas
      enabled: false
