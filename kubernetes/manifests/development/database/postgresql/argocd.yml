---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: default
  labels:
    app: postgresql
spec:
  project: default
  source:
    repoURL: https://github.com/mjhfvi/HomeDevLab.git
    targetRevision: main
    path: /kubernetes/manifests/development/database/postgresql
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
