---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only

filepath: helmfile.yaml
helmBinary: helm
missingFileHandler: Warn

helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  historyMax: 10
  createNamespace: true
  skipDeps: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 300

repositories:
  - name: kestra
    url: https://helm.kestra.io/

releases:
  - name: kestra
    namespace: automation
    chart: kestra/kestra
    version: 2.0.8
    # rollbackOnFailure: false
    labels:
      app.kubernetes.io/build-by: helmfile
      app.kubernetes.io/version: 2.0.8
      app.kubernetes.io/chart: kestra
    values:
      - configurations:
          secrets:
            - name: kestra-db-credentials
              key: kestra-db-credentials.yml
      - extraManifests:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: kestra-db-credentials
            stringData:
              kestra-db-credentials.yml: |
                kestra:
                  datasources:
                    postgres:
                      url: jdbc:postgresql://postgres:5432/kestra
                      username: admin
                      password: password
