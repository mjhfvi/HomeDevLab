apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: kubectl-test-emails-
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.email: Tzahi@octopus-app.com
spec:
  serviceAccountName: argo-workflows-server-controller
  nodeSelector:
    octopus.infrastructure.as.code/node-instance-purpose: general-purpose-pool
  entrypoint: kubectl-workflow # workflow entry point template
  onExit: send-email # optional exit handler template
  templates:
    - name: kubectl-workflow
      steps:
        - - name: top-pods-observability
            template: run-command
            arguments:
              parameters:
                - name: command
                  value: top pods -n observability
        - - name: notify
            template: send-email
            when: "{{workflow.status}} == Succeeded"
    - name: send-email
      annotations:
        notifications.argoproj.io/subscribe.on-succeeded.email: Tzahi@octopus-app.com
        notifications.argoproj.io/subscribe.on-sync-succeeded.email: Tzahi@octopus-app.com
      container:
        image: alpine:3.23
        command: [sh, -c]
        args:
          [
            "echo send e-mail: {{workflow.name}} {{workflow.status}} {{workflow.duration}}",
          ]
    - name: run-command
      inputs:
        parameters:
          - name: command
      container:
        image: alpine/kubectl:latest
        command:
          - sh
          - -c
        args:
          - kubectl {{inputs.parameters.command}}
