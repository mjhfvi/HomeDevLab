---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: development-app-of-apps-postgresql
  namespace: infrastructure
spec:
  project: homedevlab
  source:
    repoURL: https://github.com/mjhfvi/HomeDevLab.git
    targetRevision: HEAD
    path: database/postgresql
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
