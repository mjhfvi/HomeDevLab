---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-postgresql
  namespace: infrastructure
spec:
  project: homedevlab
  source:
    repoURL: https://github.com/mjhfvi/HomeDevLab.git
    targetRevision: HEAD
    path: database/postgresql
    directory:
      recurse: true
      include: '{*.yaml,*.yml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
