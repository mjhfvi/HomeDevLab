---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
# kustomizeBinary: kustomize
helmDefaults:
  # verify: false
  # enableDNS: false
  # waitForJobs: false
  timeout: 60
  # skipDeps: false
  # reuseValues: false
  # deleteWait: false
  # deleteTimeout: 0
repositories:
  - name: trivy
    url: https://aquasecurity.github.io/helm-charts/
releases:
  - name: trivy
    namespace: security
    createNamespace: true
    chart: trivy/trivy-operator
    labels:
      app.kubernetes.io/name: trivy-operator
    #   version: 0.0.0
    #   missingFileHandler: Warn  # set to either "Error" or "Warn". "Error" instructs helmfile to fail when unable to find a values or secrets file. When "Warn", it prints the file and continues.
    #   verify: true
    #   timeout: 60
    #   cleanupOnFail: true
    # values:
    #   - values.yaml

# helm install trivy trivy/trivy-operator --namespace security --create-namespace
# helm uninstall trivy --namespace security
# kubectl -f trivy-operator-secret.yaml apply
# kubectl -f trivy-operator-secret.yaml delete
# user: admin password: admin
