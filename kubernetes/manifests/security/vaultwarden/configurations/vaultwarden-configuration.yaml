---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-configuration
  namespace: infra
  labels:
    app.kubernetes.io/instance: vaultwarden
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vaultwarden
data:
  SSO_ENABLED: 'true'
  SSO_ONLY: 'true' # default is 'false', set to 'true' to only allow SSO logins (no local accounts)
  SSO_CLIENT_ID: [ get from azure application ]
  SSO_CLIENT_SECRET: [ get from azure application ]
  SSO_AUTHORITY: 'https://login.microsoftonline.com/111111-11-11-11-111111/v2.0'
  SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION: 'true'
  SIGNUPS_DOMAIN_WHITELIST: 'app.com'
