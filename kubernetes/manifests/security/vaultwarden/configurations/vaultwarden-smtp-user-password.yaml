---
apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-smtp-user-password
  namespace: infra
data:
  username: [ get_from_aws ]
  password: [ get_from_aws ]

type: Opaque

# 'admin' base64 encoded (echo -n 'admin' | base64)
# 'mysecretpassword' base64 encoded (echo -n 'mysecretpassword' | base64)
