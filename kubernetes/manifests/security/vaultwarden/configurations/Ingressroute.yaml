---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: infra
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`wallet.aws-op-01.cloud.com`)
      services:
        - name: vaultwarden
          port: 80
          namespace: infra
  tls: {}
