---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: redis
spec:
  interval: 30m
  chart:
    spec:
      chart: redis-operator
      version: 3.3.x
      sourceRef:
        kind: HelmRepository
        name: redis-operator
        namespace: redis
  timeout: 10m
  values:
    # Resource configuration for the operator
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
    # Service account and RBAC configuration
    serviceAccount:
      create: true
