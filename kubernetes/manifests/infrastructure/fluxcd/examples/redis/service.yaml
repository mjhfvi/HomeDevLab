---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: redis
  labels:
    app: redis-cluster
    role: master
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: redis
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/part-of: redis-failover
    redisfailovers-role: master
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
# Service for Sentinel access
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: redis
  labels:
    app: redis-cluster
    role: sentinel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: sentinel
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/part-of: redis-failover
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
      protocol: TCP
