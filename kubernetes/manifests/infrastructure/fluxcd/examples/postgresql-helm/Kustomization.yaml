---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pod-example
  namespace: infrastructure
spec:
  interval: 30m0s
  path: ./kustomize
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: git-repository  # match the name of the GitRepository resource defined in GitRepository.yaml
  targetNamespace: redis
  timeout: 3m0s
  wait: true
