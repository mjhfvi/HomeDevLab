---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgresql
  namespace: postgresql
spec:
  interval: 10m
  timeout: 20m
  prune: true
  wait: true
  path: kubernetes/manifests/infrastructure/fluxcd/examples/postgresql
  sourceRef:
    kind: GitRepository
    name: git-repository
