---
# Commands to deploy:
# helmfile deps  # < download dependencies
# helmfile template  # < template stuff. You might have to be signed into vault
# helmfile sync  # < deploy everything
# helmfile sync -f filename.yaml  # < deploy everything from file
# helmfile apply  # < deploy diff only
# helmfile destroy  # < deploy diff only
filepath: helmfile.yaml
helmBinary: helm
# kustomizeBinary: kustomize
helmDefaults:
    # verify: false
    # enableDNS: false
    # waitForJobs: false
    timeout: 240
    # skipDeps: false
    # reuseValues: false
    # deleteWait: false
    # deleteTimeout: 0
repositories:
    - name: argo
      url: https://argoproj.github.io/argo-helm
releases:
    - name: argo-cd
      namespace: argocd
      createNamespace: true
      chart: argo/argo-cd
      labels:
          app.kubernetes.io/forward: argo-cd
          #   version: 0.0.0
          #   missingFileHandler: Warn  # set to either "Error" or "Warn". "Error" instructs helmfile to fail when unable to find a values or secrets file. When "Warn", it prints the file and continues.
          #   verify: true
          #   timeout: 60
          #   cleanupOnFail: true
      # values:
      #   - redis-ha:
      #       enabled: true
      #   - controller:
      #       replicas: 1
      #   - server:
      #     replicas: 2
      #   - repoServer:
      #       replicas: 2
      #   - applicationSet:
      #       replicas: 2
