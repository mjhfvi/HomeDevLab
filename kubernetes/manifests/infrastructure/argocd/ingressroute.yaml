---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-argo-cd-server
  namespace: argo-cd
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`argocd.azure-prod-03.octopus-cloud.com`)
    services:
    - name: argo-cd-server
      namespace: argo-cd
      port: 80
  tls: {}
