---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: database
spec:
  chart:
    spec:
      chart: postgresql
      version: 2.1.1
      sourceRef:
        kind: HelmRepository
        name: helm-repository
  install:
    createNamespace: true
  interval: 1m0s
  targetNamespace: database
  valuesFrom:
    - kind: ConfigMap
      name: postgresql-configmap
      valuesKey: postgresql-values
    - kind: Secret
      name: postgresql-credentials
      valuesKey: user-password
      targetPath: user-password
    - kind: Secret
      name: postgresql-credentials
      valuesKey: postgres-password
      targetPath: postgres-password
    #   optional: true
