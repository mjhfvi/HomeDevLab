---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: infrastructure
  labels:
    argocd.argoproj.io/environment: development
    argocd.argoproj.io/stage: testing
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  source:
    path: ''
    repoURL: ''
    targetRevision: main
  sources:
    - name: mongodb
      repoURL: https://repo.helmforge.dev
      chart: mongodb
      targetRevision: 1.8.7
      helm:
        releaseName: values
        valueFiles:
          - $values/kubernetes/manifests/database/mongodb/credentials.yaml
          - $values/kubernetes/manifests/database/mongodb/values.yaml
    - name: values
      repoURL: https://github.com/mjhfvi/HomeDevLab
      path: kubernetes/manifests/database/mongodb
      targetRevision: main
      ref: values
      directory:
        recurse: false
        include: '*.{yaml,yml}'
        exclude: '{*.md,.helmignore,Chart.{yaml,yml},helmfile.{yaml,yml},values.example.{yaml,yml},argocd-production.{yaml,yml}}'
  project: homedevlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions: [CreateNamespace=true, PruneLast=true, Replace=true]
