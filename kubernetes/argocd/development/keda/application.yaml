---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  labels:
    app: keda
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: 2.18.3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
