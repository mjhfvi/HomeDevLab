---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgadmin
  namespace: infrastructure
  labels:
    argocd.argoproj.io/environment: development
    argocd.argoproj.io/stage: testing
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: tools
  source:
    path: ''
    repoURL: ''
    targetRevision: main
  sources:
    - name: pgadmin
      repoURL: https://helm.runix.net/
      chart: pgadmin4
      targetRevision: 1.70.4
      helm:
        releaseName: values
        valueFiles:
          - $values/kubernetes/manifests/tools/pgadmin/credentials.yaml
          - $values/kubernetes/manifests/tools/pgadmin/values.yaml
    - name: values
      repoURL: https://github.com/mjhfvi/HomeDevLab
      path: kubernetes/manifests/tools/pgadmin
      targetRevision: main
      ref: values
      directory:
        recurse: false
        include: '*.{yaml,yml}'
        exclude: '{*.md,.helmignore,Chart.{yaml,yml},helmfile.{yaml,yml},values.example.{yaml,yml},argocd-production.{yaml,yml}}'
  project: homedevlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions: [CreateNamespace=true, PruneLast=true, Replace=true]
