# ---
# apiVersion: argoproj.io/v1alpha1
# kind: Application
# metadata:
#   name: development-apps
#   namespace: database
#   # finalizers:
#   #   - resources-finalizer.argocd.argoproj.io
# spec:
#   project: homedevlab
#   source:
#     repoURL: https://github.com/mjhfvi/HomeDevLab
#     targetRevision: main
#     path: kubernetes\manifests\development\database\postgresql
#   destination:
#     server: https://kubernetes.default.svc
#     namespace: database  # Child apps are created in the database namespace
#   syncPolicy:
#     automated:
#       prune: true    # Remove child apps when their YAML is deleted
#       selfHeal: true # Recreate child apps if manually deleted
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-apps-development
  namespace: database
spec:
  project: homedevlab
  source:
    repoURL: https://github.com/mjhfvi/HomeDevLab
    targetRevision: main
    path: kubernetes\manifests\development\database\postgresql
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
