---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-development
  namespace: infrastructure
  labels:
    argocd.argoproj.io/environment: development
    argocd.argoproj.io/stage: testing
spec:
  project: homedevlab
  source:
    repoURL: https://github.com/mjhfvi/HomeDevLab.git
    targetRevision: main
    path: kubernetes/manifests/development
    directory:
      recurse: false
      include: '{app-of-apps-*.yaml,app-of-apps-*.yml}'
      exclude: '{*.json,*.lock}'
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# kubectl --namespace infrastructure -f root-apps-of-app.yaml apply
# kubectl --namespace infrastructure -f root-apps-of-app.yaml delete
