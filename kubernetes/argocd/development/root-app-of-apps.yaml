---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-of-apps
  namespace: database
spec:
  project: homedevlab
  source:
    repoURL: https://github.com/mjhfvi/HomeDevLab
    targetRevision: main
    path: kubernetes/manifests/development
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# kubectl -f root-apps-of-app.yaml apply
# kubectl -f root-apps-of-app.yaml delete
