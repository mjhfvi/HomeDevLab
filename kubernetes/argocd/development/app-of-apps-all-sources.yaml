---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-development-all-sources
  namespace: infrastructure
  labels:
    argocd.argoproj.io/environment: development
    argocd.argoproj.io/stage: testing
spec:
  source:
    path: ''
    repoURL: ''
    targetRevision: main
  sources:
    - name: database
      repoURL: https://github.com/mjhfvi/HomeDevLab.git
      path: kubernetes/manifests/database
      targetRevision: main
      directory:
        recurse: true
        include: '**/argocd-development.{yaml,yml}'
        exclude: '{*.md,*.json,.helmignore}'
    - name: automation
      repoURL: https://github.com/mjhfvi/HomeDevLab.git
      path: kubernetes/manifests/automation
      targetRevision: main
      directory:
        recurse: true
        include: '**/argocd-development.{yaml,yml}'
        exclude: '{*.md,*.json,.helmignore}'
  destination:
    server: https://kubernetes.default.svc
    # namespace: database
  project: homedevlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# kubectl --namespace infrastructure -f root-apps-of-app.yaml apply
# kubectl --namespace infrastructure -f root-apps-of-app.yaml delete
